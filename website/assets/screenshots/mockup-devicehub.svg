  </g>
  <rect x="32" y="264" width="736" height="130" rx="12" fill="#FFFFFF" stroke="#D9CDB7"/>
  <text x="56" y="292" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#182E3B">Nhật ký kiểm tra thiết bị (ví dụ bố cục)</text>
  <rect x="56" y="308" width="680" height="10" rx="4" fill="#EDE6D8"/>
