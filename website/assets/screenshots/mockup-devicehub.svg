<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="t2 d2">
  <title id="t2">Bản thiết kế dự kiến (mockup) — Device Hub / trung tâm thiết bị</title>
  <desc id="d2">Hình minh họa bố cục dự kiến của màn hình quản lý máy in, Wi-Fi, Bluetooth. Đây KHÔNG phải ảnh chụp màn hình phần mềm đang chạy thật.</desc>
  <rect width="800" height="450" fill="#EDE6D8"/>
  <rect x="8" y="8" width="784" height="434" rx="16" fill="#FBF8F2" stroke="#8C8068" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="32" y="32" width="736" height="48" rx="10" fill="#FFFFFF" stroke="#D9CDB7"/>
  <rect x="56" y="48" width="160" height="16" rx="4" fill="#C93643"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#52646B">
