    <circle cx="70" cy="140" r="18" fill="#1F5E70"/>
    <text x="100" y="135" fill="#182E3B" font-weight="700">Máy in</text>
    <text x="100" y="155">Chưa xác minh</text>
    <rect x="48" y="196" width="180" height="10" rx="4" fill="#EDE6D8"/>

    <rect x="285" y="100" width="230" height="140" rx="12" fill="#FFFFFF" stroke="#D9CDB7"/>
    <circle cx="323" cy="140" r="18" fill="#965300"/>
    <text x="353" y="135" fill="#182E3B" font-weight="700">Wi-Fi</text>
    <text x="353" y="155">Chưa xác minh</text>
    <rect x="301" y="196" width="180" height="10" rx="4" fill="#EDE6D8"/>

    <rect x="538" y="100" width="230" height="140" rx="12" fill="#FFFFFF" stroke="#D9CDB7"/>
    <circle cx="576" cy="140" r="18" fill="#965300"/>
    <text x="606" y="135" fill="#182E3B" font-weight="700">Bluetooth</text>
    <text x="606" y="155">Chưa xác minh</text>
