name: build-iso

# Build ISO NaMiOS THAT tren runner Linux amd64 cua GitHub (build host hop le
# theo BUILD-001). Build chay trong container debian:trixie --privileged de
# dung live-build/debootstrap native cho Debian 13. KHONG tao ISO gia: neu
# build fail, job fail + van upload build.log de chan doan.
on:
  workflow_dispatch:
  push:
    tags:
      - 'iso-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim disk (free ~25GB tren /)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - name: Stage live-build config tren /mnt (dia lon ~65GB)
        run: |
          sudo mkdir -p /mnt/nm
          sudo chown "$USER":"$USER" /mnt/nm
          cp -r distro/live-build /mnt/nm/lb
          df -h /mnt

      - name: Build ISO trong debian:trixie (privileged)
        run: |
          set -o pipefail
          docker run --privileged --rm \
            -v /mnt/nm/lb:/w -w /w \
            -e NAMIOS_LB_DISTRIBUTION=trixie \
            debian:trixie sh -eu ci-build.sh 2>&1 | tee /mnt/nm/build.log

      - name: Collect ISO + checksum + log
        if: always()
        run: |
          mkdir -p out
          cp /mnt/nm/build.log out/build.log 2>/dev/null || true
          ISO="$(ls /mnt/nm/lb/*.iso 2>/dev/null | head -1 || true)"
          if [ -n "$ISO" ]; then
            STAMP="$(date -u +%Y%m%d)"
            cp "$ISO" "out/namios-alpha-${STAMP}-amd64.iso"
            ( cd out && sha256sum namios-alpha-*.iso > SHA256SUMS )
            echo "ISO_OK=1" >> "$GITHUB_ENV"
            ls -lh out
          else
            echo "KHONG co ISO duoc tao — xem out/build.log" | tee out/NO_ISO.txt
          fi

      - name: Tu kiem chung ISO ngay tren runner (bootable? BUILD-003/INSTALL-001)
        if: always()
        run: |
          set +e
          mkdir -p out
          OUT="out/iso-verify.txt"
          : > "$OUT"
          ISO="$(ls out/namios-alpha-*.iso 2>/dev/null | head -1 || true)"
          if [ -z "$ISO" ]; then
            {
              echo "=== NaMiOS ISO self-verify ==="
              echo "KHONG co ISO (buoc build truoc that bai) — bo qua kiem chung."
              echo "verified_on_boot: NO (chua boot tren VM/USB thuc te)"
            } | tee -a "$OUT" | tee -a /mnt/nm/build.log
            exit 0
          fi

          echo "Cai cong cu kiem chung: file, genisoimage (isoinfo), xorriso ..."
          sudo apt-get update -y >/dev/null 2>&1
          sudo apt-get install -y --no-install-recommends file genisoimage xorriso >/dev/null 2>&1

          {
            echo "=== NaMiOS ISO self-verify (BUILD-003 / INSTALL-001) ==="
            echo "File: $ISO"
            echo
            echo "--- file(1) ---"
            file "$ISO" 2>&1
            echo
            echo "--- isoinfo -d -i (volume id, El Torito boot catalog) ---"
            isoinfo -d -i "$ISO" 2>&1
            echo
            echo "--- xorriso -toc (doi chung, dong cho khong co isoinfo) ---"
            xorriso -indev "$ISO" -toc 2>&1
            echo
            echo "--- sha256sum ---"
            sha256sum "$ISO" 2>&1
          } > "$OUT.tmp" 2>&1
          cat "$OUT.tmp" | tee -a "$OUT" | tee -a /mnt/nm/build.log
          rm -f "$OUT.tmp"

          if grep -qi "El Torito" "$OUT" || grep -qi "bootable" "$OUT"; then
            {
              echo
              echo "KET LUAN: tim thay dau hieu bootable (El Torito boot catalog / co 'bootable')."
              echo "verified_on_boot: NO (chi xac nhan cau truc ISO tren CI; CHUA boot thuc te tren VM/USB)"
            } | tee -a "$OUT" | tee -a /mnt/nm/build.log
          else
            {
              echo
              echo "CANH BAO: KHONG tim thay boot catalog El Torito / dau hieu bootable ro rang trong output tren."
              echo "KHONG tu nhan ISO nay la bootable. Can kiem tra lai cau hinh live-build (isohybrid/El Torito)."
              echo "verified_on_boot: NO"
            } | tee -a "$OUT" | tee -a /mnt/nm/build.log
          fi
          exit 0

      - name: Upload artifact (ISO + checksum + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namios-iso
          path: out/
          retention-days: 30
          compression-level: 0
