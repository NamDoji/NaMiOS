name: iso-shoot

# Build ISO NaMiOS THAT roi BOOT ngay trong QEMU + chup framebuffer — TAT CA
# trong MOT job. KHONG dung artifact (ISO 2.9GB + ca anh frame deu bi chan boi
# "Artifact storage quota has been hit", recalc 6-12h). Thay vao do: in tung
# frame ra LOG duoi dang base64 (log khong dinh quota artifact) => lay anh ve
# bang API doc log, giai ma, gui Cuong. Khong phu thuoc quota, khong cho recalc.
on:
  workflow_dispatch:
    inputs:
      boot_minutes:
        description: "So phut chup anh trong luc boot"
        required: false
        default: "40"
      menu_shots:
        description: "Mo menu Bat dau khi chup (yes/no)"
        required: false
        default: "yes"

permissions:
  contents: read

jobs:
  build-and-shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bien dich lop phu dich vi_NM (.po -> .mo) truoc khi stage
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gettext
          bash scripts/build-l10n-overlay.sh
          echo "== .mo overlay vi_NM da sinh =="
          ls -l distro/live-build/config/includes.chroot/usr/share/locale/vi_NM/LC_MESSAGES/ \
            2>/dev/null || echo "(chua co .mo — chua co .po overlay nao)"

      - name: Reclaim disk (free ~25GB tren /)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - name: Stage live-build config tren /mnt (dia lon ~65GB)
        run: |
          sudo mkdir -p /mnt/nm
          sudo chown "$USER":"$USER" /mnt/nm
          cp -r distro/live-build /mnt/nm/lb
          df -h /mnt

      - name: Build ISO trong debian:trixie (privileged)
        run: |
          set -o pipefail
          docker run --privileged --rm \
            -v /mnt/nm/lb:/w -w /w \
            -e NAMIOS_LB_DISTRIBUTION=trixie \
            debian:trixie sh -eu ci-build.sh 2>&1 | tee /mnt/nm/build.log

      - name: Collect ISO + checksum
        run: |
          mkdir -p out
          ISO="$(ls /mnt/nm/lb/*.iso 2>/dev/null | head -1 || true)"
          if [ -z "$ISO" ]; then echo "KHONG co ISO duoc tao — build that bai"; exit 1; fi
          STAMP="$(date -u +%Y%m%d)"
          cp "$ISO" "out/namios-alpha-${STAMP}-amd64.iso"
          ( cd out && sha256sum namios-alpha-*.iso > SHA256SUMS )
          ls -lh out

      - name: Cai QEMU + cong cu chup
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils imagemagick socat

      - name: Boot ISO trong QEMU (TCG) + chup framebuffer
        run: |
          set -x
          ISO="$(ls out/namios-alpha-*.iso 2>/dev/null | head -1 || true)"
          if [ -z "$ISO" ]; then echo "KHONG tim thay ISO"; ls -lR out; exit 1; fi
          echo "ISO=$ISO"; ls -lh "$ISO"
          mkdir -p shots

          qemu-system-x86_64 \
            -machine q35 -m 5120 -smp 2 -cpu max \
            -cdrom "$ISO" -boot d \
            -vga std -display none \
            -monitor unix:/tmp/mon.sock,server,nowait \
            -serial file:serial.log -no-reboot &
          QPID=$!
          echo "qemu pid=$QPID"

          # Boot menu isolinux cho ENTER de vao "Live system (amd64)". Duoi TCG menu
          # render CHAM (30-60s), nen 1-2 phat ENTER nhu truoc BI TRUOT -> frame ket o
          # menu mai mai (su co 06/11: ca 25 frame y het = van o boot menu). FIX: BOM
          # ENTER lien tuc moi 10s trong ~4 phut dau (chay nen); khi menu hien, ENTER
          # chac chan lot vao -> boot muc mac dinh. Boot roi thi ENTER thua vo hai.
          ( for _ in $(seq 1 24); do
              echo "sendkey ret" | socat - unix-connect:/tmp/mon.sock 2>/dev/null || true
              echo "sendkey kp_enter" | socat - unix-connect:/tmp/mon.sock 2>/dev/null || true
              sleep 10
            done ) &
          KPID=$!

          snap() {
            echo "screendump /tmp/s.ppm" | socat - unix-connect:/tmp/mon.sock 2>/dev/null || true
            sleep 2
            if [ -s /tmp/s.ppm ]; then
              convert /tmp/s.ppm "shots/$1.png" 2>/dev/null || cp /tmp/s.ppm "shots/$1.ppm"
              rm -f /tmp/s.ppm
              echo "captured $1"
            else
              echo "no framebuffer yet ($1)"
            fi
          }

          # wake: moi phut nhan 1 phim vo hai (shift) de reset idle -> tranh man den
          # sau ~10' (su co: frame 14min+ den vi DPMS/screen-off). openmenu: mo MENU
          # BAT DAU (Kickoff) bang phim Super THAT (meta_l) qua QEMU monitor — dang tin
          # hon goi D-Bus trong guest (hook 0500 goi qdbus khong an duoi TCG). Esc truoc
          # de ve trang thai dong roi moi Super -> chac chan toggle sang MO.
          wake() { echo "sendkey shift" | socat - unix-connect:/tmp/mon.sock 2>/dev/null || true; }
          key()  { echo "sendkey $1"   | socat - unix-connect:/tmp/mon.sock 2>/dev/null || true; }
          # Mo menu Bat dau bang 2 CACH DOC LAP (de chac chan bat duoc it nhat 1 —
          # day la thu Cuong can nhat; 2 lan truoc chi dung 1 cach deu TRUOT):
          #   (a) Super/Meta (meta_l) = shortcut mac dinh mo Kickoff.
          #   (b) Alt+F1              = shortcut "Activate Application Launcher Widget".
          # Moi lan: esc (dam bao dang dong) -> mo -> cho TCG ve xong (4s) -> chup.
          menushot() {
            key esc; sleep 1; key meta_l;  sleep 4; snap "frame_${1}min_menu_super"
            key esc; sleep 1; key "alt-f1"; sleep 4; snap "frame_${1}min_menu_altf1"
          }

          sleep 25; snap "frame_00_early"
          MIN="${{ inputs.boot_minutes }}"
          i=0
          while [ "$i" -lt "$MIN" ]; do
            sleep 60; i=$((i+1))
            wake
            # Tu phut 4 tro di (Plasma da len duoi TCG): thu mo menu Bat dau MOI PHUT,
            # chup CA 2 cach -> toi da hoa co hoi co 1 khung menu dang MO.
            # Tat bang input menu_shots=no khi muon chup app (Office) khong bi menu che.
            if [ "${{ inputs.menu_shots }}" = "yes" ] && [ "$i" -ge 4 ]; then menushot "$(printf '%02d' "$i")"; fi
            snap "frame_$(printf '%02d' "$i")min"
            if ! kill -0 "$QPID" 2>/dev/null; then echo "qemu da thoat"; break; fi
          done

          kill "$KPID" 2>/dev/null || true
          echo "quit" | socat - unix-connect:/tmp/mon.sock 2>/dev/null || true
          sleep 3; kill "$QPID" 2>/dev/null || true
          echo "=== serial.log (tail) ==="; tail -80 serial.log 2>/dev/null || true
          echo "=== shots ==="; ls -lh shots

      - name: Nhung tung frame vao LOG duoi dang base64 (khong dung artifact/quota)
        if: always()
        run: |
          shopt -s nullglob
          n=0
          for f in shots/*.png shots/*.ppm; do
            [ -s "$f" ] || continue
            # PPM -> PNG neu can, de anh gui ra nho + xem duoc
            case "$f" in
              *.ppm) convert "$f" "${f%.ppm}.png" 2>/dev/null && f="${f%.ppm}.png" ;;
            esac
            name="$(basename "$f")"
            sz=$(wc -c < "$f")
            echo "===B64FRAME_START name=${name} bytes=${sz}==="
            base64 -w 100 "$f"
            echo "===B64FRAME_END name=${name}==="
            n=$((n+1))
          done
          echo "B64_FRAMES_EMITTED=${n}"
