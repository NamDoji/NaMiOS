# NaMiOS — override cua live-build config/bootloaders/syslinux_common/menu.cfg
#
# Day la file DUOC GOP (khong thay the toan bo) vao template he thong cua
# live-build: binary_syslinux copy "share/bootloaders/syslinux_common/*" truoc
# (menu.cfg goc, "menu title Boot menu" + include utilities.cfg goc tieng Anh),
# roi copy "config/bootloaders/syslinux_common/*" (file nay) DE GHI DE len tung
# file trung ten - xac nhan truc tiep tu script that
# /usr/lib/live/build/binary_syslinux cua goi live-build_20250505+deb13u1 (trixie,
# tai tu deb.debian.org 10/11/2026, doc truc tiep source, khong doan):
#   cp -a ${_SOURCE_COMMON}/* chroot/root/${_BOOTLOADER}/   # he thong truoc
#   cp -af ${_SOURCE}/* chroot/root/${_BOOTLOADER}/         # he thong (isolinux-specific)
#   [ -e config/bootloaders/syslinux_common ] && cp -af .../* ...  # file nay (GHI DE)
#   [ -e config/bootloaders/isolinux ]        && cp -af .../* ...  # ghi de tiep (neu co)
# => CHI can override dung nhung file can doi ten/mau, KHONG can chep lai toan bo
# isolinux.bin/ldlinux.c32/vesamenu.c32/... (khac han co che "_SOURCE thay the
# toan bo" cua cac ban live-build cu hon ma minh tung doc nham truoc khi tai
# .deb that de doi chieu).
#
# Giu nguyen 100% cau truc goc (menu hshift/width, include stdmenu.cfg, include
# live.cfg, placeholder @OPTIONAL_INSTALLER_INCLUDE@, khoi "menu begin
# utilities ... menu end") — CHI doi text hien thi sang NaMiOS. Khong dung dau
# tieng Viet (ạ/ộ/ủ/ế...) trong cac dong "menu title"/"menu label" ma vesamenu.c32
# (syslinux, render VGA/BIOS text truyen thong, khong co codepage Unicode rieng
# trong theme nay — khong co file .cp di kem) se ve truc tiep: RUI RO MOJIBAKE
# tren phan cung BIOS that chua duoc kiem chung (verified_on_host: NO). Dung ban
# khong-dau de dam bao hien thi dung tren MOI may, kem ghi chu o day de ai do co
# the doi sang co dau sau khi boot-test that xac nhan vesamenu hien dung UTF-8.
#
# verified_on_host: NO — chua chay qua `lb build` + boot QEMU/may that.

menu hshift 0
menu width 82

menu title NaMiOS - He dieu hanh cho nguoi Viet
include stdmenu.cfg
include live.cfg
@OPTIONAL_INSTALLER_INCLUDE@
menu begin utilities
	menu label ^Cong cu
	menu title Cong cu
	include stdmenu.cfg
	label mainmenu
		menu label ^Quay lai..
		menu exit
	include utilities.cfg
menu end

menu clear
