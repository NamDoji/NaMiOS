# NaMiOS — override cua config/bootloaders/syslinux_common/stdmenu.cfg
#
# Giu nguyen cau truc + "menu background splash.png" (splash.png that duoc cung
# cap san tai config/bootloaders/isolinux/splash.png — xem ghi chu co che tai
# do; binary_bootloader_splash se THAY vi tu tim/convert SVG vi isolinux da co
# san splash.png truoc khi script do chay, xac nhan tu thu tu goi lenh trong
# /usr/lib/live/build/binary: binary_grub_cfg(58) + binary_syslinux(59) chay
# TRUOC binary_bootloader_splash(65)).
#
# Doi mau "menu color sel"/"hotsel" tu xanh duong mac dinh cua live-build
# (#76a1d0ff) sang do son #C93643 (usr/share/namios-branding/logo/brand.json).
# Dinh dang mau syslinux la #AARRGGBB (AA=do mo, khong phai #RRGGBBAA kieu CSS)
# — da doi chieu voi gia tri goc "#76a1d0ff" (AA=76 ~46% mo, RGB=a1d0ff xanh
# nhat) de suy ra dung thu tu kenh truoc khi doi. Doi "help" tu vang mac dinh
# (#ffdddd00) sang vang tam #F2C66D cho dong bo bang mau NaMiOS.
#
# POLISH 10/11/2026 (wave "boot-identity"): splash.png doi tu nen mau xanh
# muc_dem sang nen nga am — da SIEU-XI (supersede) boi wave "Dong Son" duoi
# day, xem git log file nay neu can doi chieu ban nga-am cu.
#
# WAVE "DONG SON" 11/11/2026 (nhiem vu rieng giao cho system-screens dev —
# thay nhan dien BOOT/LOGIN/SPLASH tu v2 "Sen Viet" sang v3 "Dong Son"):
# nguoi giao nhiem vu xac nhan RO RANG palette "NaMiOS v3 Dong Son" (navy
# #092D4F lam NEN cho rieng 3 diem cham-tram boot/login/splash) SIEU-XI
# quyet dinh 09/11/2026 "sen quy khong dat nen den" CHI cho 3 mat nay. Doi
# TOAN BO mau chu/pill o day theo nen moi (navy, nguoc lai huong "boot-
# identity" 10/11 vi khi do la nga am):
#   - title / tabmsg ("Press ENTER..."): doi lai ngoc trai #fff9ef (sang, doc
#     ro tren navy)
#   - help ("F1..."): vang #DEA93E (mau "progress/signature accent" v3, dong
#     bo voi help label ben GRUB — xem config/bootloaders/grub-pc/live-theme/
#     theme.txt cung dot sua)
#   - sel/hotsel: pill nen do-son/vermilion v3 #D64C3E (giu do mo 0xE6 ~90%
#     tu ban truoc — pill du dam de "an" ro vung chon tren navy), chu trang
#     #ffffffff giu nguyen (contrast ~4.2:1 tren vermilion — kiem bang cong
#     thuc WCAG luc thuc hien, chap nhan duoc cho pill chon/bitmap font cua
#     vesamenu, khac Unifont-16 cua GRUB; can QA mat that khi co boot-test)
#
# verified_on_host: NO — mau hien thi that phu thuoc driver VESA/BIOS cua may
# that, chua kiem chung ngoai doc spec dinh dang #AARRGGBB cua syslinux.

menu background splash.png
menu color title	* #fffff9ef *
menu color border	* #00000000 #00000000 none
menu color sel		* #ffffffff #e6D64C3E *
menu color hotsel	1;7;37;40 #ffffffff #e6D64C3E *
menu color tabmsg	* #fffff9ef #00000000 *
menu color help		37;40 #ffDEA93E #00000000 none
menu vshift 12
menu rows 10
menu helpmsgrow 15
# The command line must be at least one line from the bottom.
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg Press ENTER to boot or TAB to edit a menu entry
