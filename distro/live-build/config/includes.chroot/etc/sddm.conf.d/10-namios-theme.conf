# NaMiOS — chon theme SDDM thuong hieu "namios" (xem
# includes.chroot/usr/share/sddm/themes/namios/) — DAY LA FILE MOI, KHONG
# sua file autologin Live/demo cua hook 0400-qemu-desktop-autologin.hook.chroot
# (file do do HOOK TAO O BUILD-TIME thanh
# /etc/sddm.conf.d/zz-namios-autologin.conf, KHONG phai file tinh trong
# includes.chroot nay — khong co gi de "dong vao" o day).
#
# TRAT TU MERGE (xac nhan — SDDM doc /etc/sddm.conf.d/* theo thu tu ABC,
# file sau de len gia tri cung key cua file truoc; nguon: man page
# sddm.conf(5), Debian/Arch deu ghi "Files are read in alphabetical order"):
#   - Tren ANH LIVE: ca hai file cung ton tai trong /etc/sddm.conf.d/ —
#     "10-namios-theme.conf" (file nay, Current=namios) VA
#     "zz-namios-autologin.conf" (hook 0400, Current=breeze). "10-" < "zz-"
#     theo ABC -> file "zz-" doc SAU -> gia tri Current=breeze CUA NO THANG
#     tren Live. KET QUA: theme "namios" (chua qua boot thuc) KHONG co hieu
#     luc tren nhanh Live/QEMU — day la Y DO, khong phai loi: Live/QEMU
#     thuong khong GPU (software rendering), va chinh du an nay da tung
#     chu dong KHONG lam theme QML rieng vi rui ro man den duoi dieu kien do
#     (xem header includes.chroot/usr/share/sddm/themes/breeze/theme.conf.user).
#     Hon nua Autologin cua hook 0400 BO QUA greeter hoan toan khi hoat dong
#     dung (xem comment trong chinh file do), nen theme nao duoc chon tren
#     Live gan nhu khong quan trong — "breeze" (theme da duoc KDE kiem thu
#     production) van la nhanh du phong AN TOAN HON cho truong hop greeter
#     lo hien ra tren may khong GPU.
#   - Tren MAY DA CAI qua Calamares: hook
#     0420-installed-sddm-restore.hook.chroot (chay 1 lan dau boot, gate
#     ConditionKernelCommandLine=!boot=live) XOA HAN
#     /etc/sddm.conf.d/zz-namios-autologin.conf (buoc (d) trong script do).
#     Sau khi xoa, CHI CON file nay trong /etc/sddm.conf.d/ dinh nghia
#     [Theme] Current -> theme "namios" co hieu luc THAT tren may da cai.
#     May da cai thuong CO driver GPU/KMS thuc (khong giong QEMU/TCG software
#     rendering cua nhanh Live), nen day cung la dung noi theme QML rieng
#     an toan hon de dua vao su dung THAT.
#
# verified_on_host: NO — CHUA xac nhan ca co che merge tren (du da doc dung
# man page) VA hanh vi thuc te cua hook 0420 tren mot lan cai dat qua
# Calamares thuc. Can boot thuc + kiem tra /etc/sddm.conf.d/ sau khi cai +
# xem /var/log/sddm.log de xac nhan "Current=namios" duoc ap dung dung.
[Theme]
Current=namios
