#
# NaMiOS — cấu hình module "locale" của Calamares (trang chọn múi giờ lúc
# cài). THÊM file này (Cuong, 11/11/2026): một lần pilot cài thật cho thấy
# trình cài tự chọn sẵn múi giờ America/New_York (mặc định upstream khi
# không có file này) — sai hoàn toàn cho "hệ điều hành cho người Việt".
#
# Lược đồ + tên khoá đối chiếu TRỰC TIẾP với mã nguồn thật của Calamares
# (github.com/calamares/calamares, nhánh `calamares`,
# src/modules/locale/locale.conf, tra cứu 11/11/2026): hai khoá top-level
# `region`/`zone` là "điểm neo" (pin-on-the-map) ban đầu khi vào trang
# locale; không đặt → rơi về mặc định cứng "America/New_York" của chính
# Calamares (đúng như pilot đã thấy). Đường dẫn file: cùng quy ước đã đối
# chiếu cho `partition.conf` ở cạnh (`/etc/calamares/modules/<tên>.conf`),
# xem comment đầu file đó để biết 3 nguồn đối chiếu độc lập.
#
# KHÔNG đặt `geoip:` ở đây (để nguyên không khai báo) — cố ý tắt GeoIP: để
# NaMiOS không phụ thuộc Internet lúc cài (đúng tinh thần build offline-first
# của repo này) và để giá trị tĩnh region/zone dưới đây LUÔN LUÔN là điểm
# neo ban đầu, không bị một dịch vụ GeoIP bên ngoài ghi đè ngầm.
#
# verified_on_host: NO — chưa mở Calamares thật (ISO đã build) để xác nhận
# trang "Múi giờ" vào mặc định đúng Asia/Ho_Chi_Minh. Môi trường soạn file
# này không có qemu/live-build//dev/kvm (xem CLAUDE.md "Môi trường build
# hiện tại").

region:                     "Asia"
zone:                       "Ho_Chi_Minh"
