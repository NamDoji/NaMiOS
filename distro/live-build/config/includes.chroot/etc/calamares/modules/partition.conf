# NaMiOS — cấu hình module "partition" của Calamares (ổ cứng/phân vùng lúc cài).
#
# Giao việc gốc: cho người dùng chia ổ kiểu "C:, D:" như Windows, NHƯNG vẫn
# giữ đường dễ-nhanh cho người ít hiểu kỹ thuật. SỰ THẬT (không né): Linux
# không có khái niệm "ổ C:/D:" (ký tự ổ đĩa) — tương đương gần nhất là MỘT
# phân vùng hệ thống (gắn vào "/") + (tuỳ chọn) MỘT phân vùng dữ liệu riêng
# (gắn vào một điểm gắn khác, ví dụ "/data"). File này KHÔNG bịa ra ký tự ổ
# đĩa — chỉ làm cho 2 lựa chọn CÓ THẬT của Calamares (Xoá-ổ-tự-động / Tự chia
# tay) dễ hiểu + đặt tên kiểu-Windows cho phân vùng. Xem thêm
# usr/share/namios/docs/INSTALL-PARTITION.md (hướng dẫn người dùng, 2 lối đi,
# kèm ghi chú thật-thà về khác biệt Windows/Linux).
#
# ĐƯỜNG DẪN FILE NÀY — SỬA LẠI SO VỚI YÊU CẦU GỐC, CÓ LÝ DO: việc giao ban đầu
# ghi "etc/calamares/modules.d/partition.conf". Đã đối chiếu TRỰC TIẾP 3 nguồn
# độc lập (tra cứu 10/11/2026):
#   1. calamares/calamares (nhánh `calamares`) — wiki "Deploy Configuration"
#      (github.com/calamares/calamares/wiki/Deploy-Configuration): cấu hình
#      từng module được nạp từ "/etc/calamares/modules/<tên>.conf" (đứng
#      trước) hoặc "$SHARE/calamares/modules/<tên>.conf" (mặc định đóng gói).
#   2. Chính file mẫu thật trong mã nguồn Calamares:
#      raw.githubusercontent.com/calamares/calamares/master/src/modules/
#      partition/partition.conf — đường dẫn trong repo là
#      "src/modules/partition/partition.conf", khi đóng gói/deploy nằm ở
#      "/etc/calamares/modules/partition.conf".
#   3. Ví dụ nhiều bản phân phối khác (Kicksecure live-config-dist, BioArch,
#      CachyOS, RebornOS...) đều dùng "etc/calamares/modules/partition.conf"
#      — KHÔNG có bản nào dùng "modules.d".
# → Calamares KHÔNG đọc bất kỳ thư mục "modules.d" nào — đây không phải quy
# ước của Calamares (có thể là nhầm với quy ước "*.list.d"/"sources.list.d"
# của APT/live-build, hai hệ thống khác). Nếu đặt file ở "modules.d/" như
# yêu cầu gốc, Calamares sẽ KHÔNG BAO GIỜ đọc được file này — toàn bộ việc
# này sẽ VÔ HIỆU mà không có lỗi nào báo ra (im lặng, giống lỗi "Vigo" của
# branding trước đây đã gặp phải và ghi lại trong settings.conf). Để tránh
# lặp lại đúng loại lỗi đó, file này được đặt ở đường dẫn ĐÃ XÁC MINH THẬT:
#   includes.chroot/etc/calamares/modules/partition.conf   (KHÔNG có "modules.d")
# Đã báo lại sự khác biệt này ở báo cáo giao việc.
#
# NỀN GỐC — nội dung/khoá dưới đây đối chiếu TỪNG KHOÁ với file mẫu CHÍNH THỨC
# ở mục 2 phía trên (SPDX-FileCopyrightText: no; SPDX-License-Identifier:
# CC0-1.0) — chỉ giữ lại khoá CÓ THẬT trong file mẫu đó, không bịa khoá nào.
# Mọi khoá KHÔNG được đặt ở đây giữ đúng giá trị mặc định của Calamares (ví
# dụ enableLuksAutomatedPartitioning, defaultPartitionTableType,
# requiredPartitionTableType, createHybridBootloaderLayout — xem lý do từng
# cái ở các mục dưới).
#
# verified_on_host: NO — chưa `lb build` + cài thật để xác nhận trang "Choice"
# hiện đúng 4 lựa chọn + Erase được chọn sẵn + tên phân vùng "NaMiOS" hiện
# đúng sau khi cài xong (`lsblk -f` / `blkid`). Môi trường soạn file này
# không có qemu/live-build//dev/kvm (xem CLAUDE.md "Môi trường build hiện
# tại"). Mọi khoá bên dưới lấy nguyên văn tên+kiểu dữ liệu từ file mẫu chính
# thức, không suy đoán cú pháp.

---

# ---------------------------------------------------------------------------
# 1) Phân vùng EFI (UEFI) — CHỈ áp dụng khi máy khởi động ở chế độ UEFI.
#    Máy BIOS/Legacy (bảng phân vùng msdos) sẽ KHÔNG có phân vùng này —
#    Calamares tự quyết theo firmware thật của máy, không cần cấu hình riêng
#    (xem mục 4 "vì sao không đặt defaultPartitionTableType").
#    minimumSize hạ xuống 100MiB (thấp hơn recommendedSize 300MiB mặc định)
#    để lối "Install alongside" (cài cạnh Windows có sẵn) không bị CHẶN CỨNG
#    khi máy cũ có sẵn phân vùng EFI nhỏ (nhiều máy Windows cũ dùng EFI
#    100MiB) — recommendedSize vẫn giữ 300MiB cho phân vùng MỚI tạo (đủ chỗ
#    cho nhiều bootloader/kernel về sau, khuyến nghị gốc của Calamares).
# ---------------------------------------------------------------------------
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        100MiB
    label:              "EFI"

# ---------------------------------------------------------------------------
# 2) Swap — cho người dùng CHỌN (không ép 1 kiểu), nhưng vẫn có mặc định hợp
#    lý sẵn để người ít hiểu kỹ thuật không cần chọn mà máy vẫn chạy ổn.
#    - none: không tạo swap (máy nhiều RAM, SSD nhỏ muốn tiết kiệm dung lượng)
#    - small: tối đa 8GiB / không quá 10% đĩa trống (mặc định an toàn chung)
#    - suspend: đủ lớn để ngủ-đông (hibernate) — máy ít RAM sẽ tốn nhiều đĩa
#    - file: swap dạng file thay vì phân vùng riêng (gọn, dễ đổi cỡ sau)
#    initialSwapChoice: "small" — tuỳ chọn ĐÃ CHỌN SẴN khi trang mở ra, để
#    người ít hiểu kỹ thuật không cần hiểu "swap" là gì vẫn có máy chạy được;
#    vẫn đổi được sang 3 lựa chọn khác bất kỳ lúc nào trước khi bấm Cài.
# ---------------------------------------------------------------------------
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small

# Đặt tên cho phân vùng swap khi tạo (chỉ có ý nghĩa với bảng GPT, cần
# KPMCore >= 4.2.0 — xem mục 3 "label kiểu Windows" về giới hạn tương tự).
swapPartitionName: "swap"

# ---------------------------------------------------------------------------
# 3) Lối "dễ-nhanh" (Erase disk / Xoá ổ-tự-động) = MẶC ĐỊNH ĐÃ CHỌN SẴN khi
#    trang "Choice" mở ra — đúng yêu cầu gốc "giữ Erase-disk auto làm đường
#    dễ nhất, một phân vùng hệ thống, đơn giản nhất cho người ít hiểu kỹ
#    thuật". GHI RÕ RỦI RO (không né): bản mẫu CHÍNH THỨC của Calamares mặc
#    định initialPartitioningChoice LÀ "none" (không chọn sẵn ô nào) — đúng
#    nguyên văn lý do trong file mẫu gốc: "để người dùng phải tự chọn một
#    cách rõ ràng, tránh bấm lướt qua một lựa chọn quan trọng, đặc biệt là
#    'erase' — một lựa chọn nguy hiểm". Chọn "erase" làm mặc định ở đây là
#    QUYẾT ĐỊNH SẢN PHẨM có chủ đích theo đúng yêu cầu của Cuong (đề cao
#    dễ-dùng cho người ít hiểu kỹ thuật hơn là an toàn-qua-ma-sát), KHÔNG
#    phải nhầm lẫn. Vẫn còn lớp an toàn tự nhiên của Calamares: trang
#    "Choice" vẫn bắt chọn ĐÚNG Ổ ĐĨA đích + hiện bản xem trước bảng phân
#    vùng trước khi cho bấm "Install now"/tiếp tục, và trang "Summary" ở
#    cuối Pha 1 hiện lại toàn bộ thay đổi sẽ ghi xuống đĩa trước khi Pha 2
#    (exec, ghi đĩa thật) chạy — người dùng vẫn phải tự bấm xác nhận tiếp ở
#    các bước đó, không phải 1-chạm-xong. CẦN XEM LẠI TRÊN MÁY/VM THẬT (danh
#    sách ở cuối usr/share/namios/docs/INSTALL-PARTITION.md): xác nhận
#    luồng Erase vẫn đủ chậm/rõ để không ai xoá nhầm ổ chứa dữ liệu khác.
# ---------------------------------------------------------------------------
initialPartitioningChoice: erase

# ---------------------------------------------------------------------------
# 4) Chia tay (Manual) — BẮT BUỘC giữ MỞ (allowManualPartitioning: true) để
#    người dùng muốn chia "C: hệ thống + D: dữ liệu" kiểu Windows vẫn tự làm
#    được — xem hướng dẫn 3-bước ở usr/share/namios/docs/INSTALL-PARTITION.md.
#    Mặc định của Calamares nếu để trống khoá này CŨNG LÀ true — đặt tường
#    minh ở đây để chống một bản cập nhật tương lai đổi mặc định mà không ai
#    biết (cùng logic đã dùng cho overviewEnabled trong UX-INTERACTION.md).
# ---------------------------------------------------------------------------
allowManualPartitioning: true

# Hiện tên/nhãn phân vùng ngay trên trang chia tay (manual) — giúp người
# dùng THẤY tên "NaMiOS"/nhãn mình vừa đặt, đúng tinh thần "thấy tên ổ kiểu
# Windows" dù không có ký tự ổ đĩa thật.
alwaysShowPartitionLabels: true

# Hệ thống tệp mặc định/được chọn sẵn = ext4 (KHÔNG đổi sang btrfs/khác):
# khớp với giả định ĐÃ GHI trong 0190-storage.list.chroot (Timeshift chạy ở
# chế độ RSYNC/hardlink cho ext4, không phải chế độ CoW của btrfs) — đổi
# filesystem ở đây mà không sửa Timeshift sẽ làm sai giả định đó. KHÔNG đặt
# thêm "availableFileSystemTypes" (không hiện danh sách-chọn-filesystem) —
# đúng mục tiêu "đơn giản cho người ít hiểu kỹ thuật", không thêm lựa chọn
# dễ chọn nhầm.
defaultFileSystemType: "ext4"

# Không đặt "drawNestedPartitions" (giữ mặc định false) — không có nhu cầu
# vẽ phân vùng lồng (extended/logical kiểu MBR cũ) cho máy cài mới.

# ---------------------------------------------------------------------------
# 5) Nhãn kiểu Windows cho lối Erase (tự động) — phân vùng hệ thống (gắn "/")
#    được đặt TÊN/NHÃN "NaMiOS" (tương đương "ổ C:" của Windows về công
#    dụng — chứa hệ điều hành). "name" trong khoá partitionLayout vừa là
#    NHÃN HỆ THỐNG TỆP (ext4 label — hoạt động trên MỌI kiểu bảng phân vùng,
#    gồm cả BIOS/msdos) vừa là TÊN PHÂN VÙNG GPT (chỉ có ý nghĩa khi bảng là
#    GPT, cần KPMCore >= 4.2.0 — nếu máy build dùng KPMCore cũ hơn, phần tên
#    GPT sẽ bị bỏ qua êm, nhưng nhãn ext4 "NaMiOS" vẫn được gán vì đó là một
#    cơ chế khác (e2label), không phụ thuộc KPMCore 4.2.0). Không khai báo
#    lại phân vùng EFI/swap ở đây — Calamares TỰ chèn thêm phân vùng EFI
#    (nếu máy UEFI, dùng khối `efi:` ở mục 1) vào ĐẦU danh sách và phân vùng
#    swap (nếu `initialSwapChoice`/người dùng chọn small|suspend, dùng
#    `swapPartitionName` ở mục 2) vào CUỐI danh sách — đúng nguyên văn ghi
#    chú trong file mẫu gốc, không phải suy đoán của NaMiOS. "size: 100%"
#    đồng nghĩa với KHÔNG đặt partitionLayout chút nào (đó là mặc định của
#    Calamares) — khác biệt DUY NHẤT khi khai báo tường minh ở đây là có
#    thêm nhãn "NaMiOS", hành vi chia dung lượng giữ nguyên y hệt mặc định.
#
#    Lối Manual (chia tay) KHÔNG đọc khối này — "partitionLayout" chỉ áp
#    dụng cho lối tự động (Erase/Alongside); khi tự chia tay, người dùng
#    TỰ GÕ nhãn phân vùng trong hộp thoại "Create" của Calamares (không có
#    khoá cấu hình nào để dựng sẵn/gợi ý trước nhãn "DATA" cho bước này —
#    KHÔNG bịa khoá giả, xem mục "Lối Manual" trong INSTALL-PARTITION.md để
#    có đúng tên gợi ý người dùng tự gõ).
# ---------------------------------------------------------------------------
partitionLayout:
    - name: "NaMiOS"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%

# ---------------------------------------------------------------------------
# KHÔNG đặt (giữ mặc định Calamares) — và lý do, để không ai tưởng bị bỏ quên:
#   - defaultPartitionTableType / requiredPartitionTableType: để trống thì
#     Calamares TỰ chọn gpt cho máy UEFI và msdos cho máy BIOS (đúng nguyên
#     văn ghi chú file mẫu gốc) — ĐÂY LÀ YÊU CẦU SỐNG CÒN của việc này ("đảm
#     bảo bootloader/EFI vẫn chạy cho CẢ BIOS và UEFI"). Nếu đặt cứng một
#     giá trị (ví dụ ép "gpt"), máy BIOS/Legacy cài bằng grub-pc (đã cài sẵn
#     trong package-lists/0700-installer.list.chroot) sẽ hỏng vì grub-pc cần
#     bảng msdos (hoặc GPT có phân vùng bios_grub riêng, mà NaMiOS CHƯA bật
#     — xem createHybridBootloaderLayout ngay dưới) để ghi được vào MBR.
#   - createHybridBootloaderLayout: để false (mặc định) — bật cờ này sẽ
#     chèn SẴN cả phân vùng bios-boot VÀ EFI vào mọi lối tự động, bất kể
#     máy đang chạy firmware nào; NaMiOS hiện PHÂN BIỆT ảnh theo firmware
#     thật của máy lúc cài (đúng cách grub-pc/grub-efi-amd64-bin đã cài
#     song song, xem package-lists/0700-installer.list.chroot) nên không
#     cần layout lai — bật thêm sẽ là thay đổi KHÔNG được yêu cầu, ngoài
#     phạm vi việc này.
#   - enableLuksAutomatedPartitioning / preCheckEncryption / luksGeneration:
#     việc này KHÔNG được giao làm mã hoá đĩa — giữ nguyên mặc định (ô "Mã
#     hoá" vẫn hiện, KHÔNG tự tích, đúng hành vi gốc) để không mở rộng phạm
#     vi ngoài yêu cầu "chia C:/D:".
#   - essentialMounts: 3 ngoại lệ "live-*"/"control"/"ventoy" đã CỨNG SẴN
#     trong chính Calamares (đúng nguyên văn ghi chú file mẫu gốc: "các
#     trường hợp ngoại lệ gắn-cứng này luôn áp dụng, không cần khai lại ở
#     đây") — NaMiOS chưa biết thêm điểm gắn đặc biệt nào khác của ảnh Live
#     nên không khai thêm, tránh bịa.
#   - showNotEncryptedBootMessage, armInstall, availableFileSystemTypes,
#     directoryFilesystemRestrictions, lvm.enable: giữ mặc định của
#     Calamares — không nằm trong phạm vi "chia C:/D: dễ-nhanh" của việc
#     này.
# ---------------------------------------------------------------------------
