# NaMiOS — bản sao TOÀN VẸN /etc/calamares/settings.conf, COPY ĐÈ lên file
# do gói calamares-settings-debian cài ra, thay cho cách vá (sed) cũ.
#
# TẠI SAO ĐỔI CÁCH LÀM (10/11/2026, sau một lần pilot thật): hook cũ
# (0710-calamares-branding.hook.chroot) chỉ sed MỘT dòng `branding: <tên>`
# trong file do GÓI cài ra lúc build. Một lần cài thử thật trên máy pilot cho
# thấy trình cài hiện tên "Vigo" (một thành phần branding mẫu dựng sẵn của
# Calamares) — nghĩa là branding "namios" KHÔNG được áp dụng (sed không khớp
# đúng thời điểm/đúng dòng, hoặc file thật của gói trixie không đúng cấu trúc
# hook đã giả định). Thay vì tiếp tục đoán và vá thêm, NaMiOS giờ SHIP NGUYÊN
# file settings.conf của chính mình tại đúng đường dẫn này trong
# includes.chroot. Theo đúng thứ tự live-build đã ghi lại trong hook 0710 (đọc
# lại ở đó): live-build cài xong MỌI gói (gồm calamares-settings-debian) RỒI
# MỚI copy includes.chroot/* lên ảnh — nên bản của NaMiOS LUÔN LUÔN COPY ĐÈ
# file gói cài, không phụ thuộc sed có khớp hay không. Cách này còn đúng với
# khuyến nghị CHÍNH THỨC của Calamares (Calamares Wiki, trang
# "Deploy Configuration", mục "Recommendations", tra cứu 10/11/2026):
# "Distributions are strongly urged to package configuration files separately
# from Calamares itself, and to install them in /etc/calamares. It is not
# recommended to edit or patch the configuration files included with
# Calamares for production use -- they are examples." — tức là patch file của
# PACKAGE (kể cả package settings riêng của Debian) là cách KHÔNG được
# khuyến nghị; ghi đè bằng file riêng dưới /etc/calamares mới là cách đúng.
#
# ĐỐI CHIẾU NỘI DUNG — KHÔNG đoán: toàn bộ nội dung dưới đây (sequence 3 pha +
# mọi khoá top-level) lấy ĐÚNG NGUYÊN VĂN từ salsa.debian.org/live-team/
# calamares-settings-debian, tag `13.0.13` (tag khớp phiên bản gói
# "13.0.13" — đúng nhánh Debian 13 "trixie" mà NaMiOS đang dùng làm nền,
# KHÔNG lấy nhầm từ branch `master`/tag `14.x` đang soạn cho Debian 14
# "forky" kế tiếp — đã kiểm tra cả hai bản, `sequence:` giống nhau 100% giữa
# 13.0.13 và 14.0.2, nhưng vẫn chọn đúng tag 13.0.13 để không lệ thuộc vào sự
# trùng hợp đó). Đối chiếu qua GitLab API (branches/tags) + raw file, tra cứu
# 10/11/2026. CHỈ đổi đúng MỘT giá trị so với bản gốc:
#     branding: debian   →   branding: namios
# KHÔNG thêm/xoá/sắp lại bất kỳ module nào trong `sequence:`. Nếu NaMiOS thêm
# bước cài riêng sau này (ví dụ trang xem trước/preview), phải thêm module đó
# vào đúng pha trong `sequence:` ở file này VÀ xác nhận gói cung cấp module
# đó đã được cài trong package-lists/0700-installer.list.chroot (ngoài phạm
# vi sửa của phần việc này — không tự đụng file đó).
#
# verified_on_host: NO — chưa `lb build` + cài thật (boot ISO + mở Calamares)
# để xác nhận trình cài hiện đúng tên/màu NaMiOS và chạy hết 3 pha không lỗi
# "module not found". Môi trường soạn file này KHÔNG có qemu/live-build/
# /dev/kvm (xem CLAUDE.md "Môi trường build hiện tại") nên không tự kiểm được
# bằng cách build+boot. Mức tin cậy CAO HƠN bản sed cũ: nội dung sequence là
# đối chiếu THẬT với tag gói khớp đúng bản nền (không phải suy đoán cấu trúc),
# và cách ghi-đè-bằng-includes.chroot loại bỏ hẳn rủi ro "sed không khớp".
# Rủi ro CÒN LẠI đã biết: nếu gói calamares-settings-debian thật trong kho
# apt trixie khác bản tag công khai đã đối chiếu (ví dụ Debian có vá riêng
# không đẩy lên salsa), một module THỪA trong sequence mà máy không có sẽ
# khiến Calamares báo lỗi khi khởi động — hook 0710 có bước dò log cảnh báo
# cho trường hợp này (fail-soft, không chặn build).

# ==== Nội dung gốc từ đây xuống GIỮ NGUYÊN VĂN cấu trúc/comment của upstream
#      (salsa.debian.org/live-team/calamares-settings-debian, tag 13.0.13,
#      file calamares/settings.conf) — chỉ đổi 'branding: debian' thành
#      'branding: namios' ở khoá `branding:` phía dưới. ====

# Configuration file for Calamares
# Syntax is YAML 1.2
---

# "local" is LIBDIR/calamares/modules with settings in SHARE/calamares/modules
modules-search: [ local, /usr/lib/calamares/modules ]

# If this is set to true, Calamares refers to itself as a "setup program"
# rather than an "installer". Defaults to the value of dont-chroot, but
# Calamares will complain if this is not explicitly set.
oem-setup: false

# If this is set to true, the "Cancel" button will be disabled entirely.
# The button is also hidden from view.
#
# This can be useful if when e.g. Calamares is used as a post-install
# configuration tool and you require the user to go through all the
# configuration steps.
#
# Default is false, but Calamares will complain if this is not explicitly set.
#
# YAML: boolean.
disable-cancel: false

# If this is set to true, the "Cancel" button will be disabled once
# you start the 'Installation', meaning there won't be a way to cancel
# the Installation until it has finished or installation has failed.
#
# Default is false, but Calamares will complain if this is not explicitly set.
#
# YAML: boolean.
disable-cancel-during-exec: false

# If this is set to true, then once the end of the sequence has
# been reached, the quit (done) button is clicked automatically
# and Calamares will close. Default is false: the user will see
# that the end of installation has been reached, and that things are ok.
#
#
quit-at-end: false

sequence:
# Phase 1 - prepare.
# View modules are shown as UI pages, jobs from job modules
# are executed immediately in the background.
# Jobs should be executed sparingly (if at all) in this phase.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# Phase 2 - install.
# View modules are not shown. Only the view modules shown
# in the previous phase are allowed, their names should be
# added here as placeholders to specify the order in which
# view module jobs should be enqueued. Job modules are
# also allowed.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

# Phase 3 - postinstall.
# View modules are shown as UI pages, jobs from job modules are
# executed immediately in the background.
# Jobs should be executed sparingly (if at all) in this phase.
- show:
  - finished

# A branding component is a directory, either in
# SHARE/calamares/branding or in /etc/calamares/branding
# (the latter takes precedence). The directory must contain a
# YAML file branding.desc which may reference additional resources
# (such as images) as paths relative to the current directory.
# Only the name of the branding component (directory) should be
# specified here, Calamares then takes care of finding it and
# loading the contents.
branding: namios

# If this is set to true, Calamares will show an "Are you sure?" prompt right
# before each execution phase, i.e. at points of no return. If this is set to
# false, no prompt is shown. Default is false.
#
# YAML: boolean.
prompt-install: false

# If this is set to true, Calamares will execute all target environment
# commands in the current environment, without chroot. This setting should
# only be used when setting up Calamares as a post-install configuration tool,
# as opposed to a full operating system installer.
#
# Some official Calamares modules are not expected to function with this
# setting. (e.g. partitioning seems like a bad idea, since that is expected to
# have been done already)
#
# Default is false (for a normal installer).
#
# YAML: boolean.
dont-chroot: false
