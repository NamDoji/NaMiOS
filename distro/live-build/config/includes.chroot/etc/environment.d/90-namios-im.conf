# NaMiOS — biến môi trường bộ gõ (fcitx5) cho phiên người dùng (systemd user
# session của Plasma 6 đọc /etc/environment.d/*.conf). Thiếu các biến này thì
# app Qt6/GTK KHÔNG nhận bộ gõ tiếng Việt dù fcitx5 đang chạy.
# verified_on_boot: NO — cần boot thật kiểm gõ Telex trong Dolphin/Kate (Qt6).
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
