<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- NaMiOS — render chữ rõ nét, ưu tiên Noto cho chữ Việt. Dùng grayscale AA
     (rgba=none) để AN TOÀN phổ quát: không tưa màu subpixel dưới QEMU/VM/HiDPI.
     Máy thật muốn subpixel LCD có thể đổi rgba=rgb trong Cài đặt. verified_on_boot: NO.

     ALIAS sans-serif (10/11/2026, "modern desktop" wave) — PHÔNG UI MẶC ĐỊNH
     đổi sang Inter (gói fonts-inter, package-lists/0300-fonts.list.chroot;
     license OFL, có trong Debian — PRA-018 không chép phông thương mại) để
     có cảm giác hiện đại/quen mắt (Windows 11 dùng Segoe UI — NaMiOS KHÔNG
     chép font đó, Inter là font OFL độc lập, chỉ cùng "cảm giác" hình học
     UI hiện đại). "Be Vietnam Pro" được liệt TRƯỚC Inter trong <prefer> làm
     chỗ trống sẵn cho tương lai (PL12.1, docs/design/DESIGN-SYSTEM.md) —
     HIỆN CHƯA vendor font đó (không có trong package-lists, không có binary
     nào được chép vào ISO ở wave này — branding/fonts/ nằm NGOÀI phạm vi file
     được giao sửa của wave này, xem báo cáo kèm theo) nên khoá named-font này
     vô hại/im lặng bị fontconfig bỏ qua, KHÔNG phải khai man "đã có Be Vietnam
     Pro". Noto Sans LUÔN ở cuối danh sách — fontconfig cascade THEO TỪNG KÝ
     TỰ (không phải theo nguyên chuỗi), nên nếu Inter thiếu glyph tiếng Việt cụ
     thể nào, ký tự đó tự rơi về Noto Sans, không mất dấu/vỡ chữ (PRA-039/040).
     verified_on_boot: NO — glyph tiếng Việt của Inter (dấu kết hợp, ư/ơ/đ)
     CHƯA được nhóm thiết kế xác nhận trên máy pilot thật (gate PL12.1 vẫn áp
     dụng cho việc "chốt" Be Vietnam Pro; Inter ở đây là lựa chọn RIÊNG, mới,
     cần soi lại y như vậy trước khi coi "đẹp hơn" = "đạt"). -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Be Vietnam Pro</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
