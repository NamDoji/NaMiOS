<?xml version="1.0" encoding="UTF-8"?>
<!--
  NaMiOS Lotus — nút THU NHỎ (vàng), chấm tròn macOS/mockup.
  Cùng cơ chế với close.svg (xem ghi chú ở đó) — tên file "minimize.svg"
  khớp AuroraeTheme::mapButtonToName(MinimizeButton).

  POLISH 11/11/2026 (wave "Đông Sơn" — icon+installer dev) — remap v2 "Sen
  Việt" (active #E5A53E / hover #F2C66D "vang_tam" / pressed #FFE1A1) sang
  token gold chính thức v3 `#DEA93E` (brand kit `05_design_tokens/
  colors.css`; `#F2C66D` có trong bảng OLD→NEW chính thức → `#DEA93E`).
  hover = đúng token gốc `#DEA93E`; active/pressed là 2 bước tối/sáng tính
  từ token này bằng CÙNG công thức dùng ở maximize.svg (active = tối hơn
  20%, mỗi kênh × 0.80 → `#B28732`; pressed = sáng hơn 35% về trắng, mỗi
  kênh + (255-kênh) × 0.35 → `#EAC782`) — không còn mã màu tự chọn tay.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">

  <g id="active">
    <circle cx="10" cy="10" r="9" fill="#B28732"/>
  </g>

  <g id="hover">
    <circle cx="10" cy="10" r="9" fill="#DEA93E"/>
  </g>

  <g id="pressed">
    <circle cx="10" cy="10" r="9" fill="#EAC782"/>
  </g>

  <g id="inactive">
    <circle cx="10" cy="10" r="9" fill="#D7DBE0" stroke="#B9C0C7" stroke-width="0.6"/>
  </g>

  <g id="hover-inactive">
    <circle cx="10" cy="10" r="9" fill="#E2E5E9" stroke="#B9C0C7" stroke-width="0.6"/>
  </g>
  <g id="pressed-inactive">
    <circle cx="10" cy="10" r="9" fill="#C3C8CE" stroke="#AAB1B9" stroke-width="0.6"/>
  </g>

</svg>
