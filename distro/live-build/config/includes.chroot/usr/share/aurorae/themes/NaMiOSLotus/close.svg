<?xml version="1.0" encoding="UTF-8"?>
<!--
  NaMiOS Lotus — nút ĐÓNG (san hô #D94D43), kiểu chấm tròn macOS/mockup
  (xem branding/style/namios.css .nm-lights .c).

  Cơ chế: MỘT file SVG riêng theo tên chuẩn Aurorae "close.svg" (đối chiếu
  src/plugins/kdecorations/aurorae/src/lib/auroraetheme.cpp
  AuroraeTheme::mapButtonToName(CloseButton) == "close", nạp qua
  initButtonFrame() -> "aurorae/themes/<theme>/close.svg"). Mỗi <g id="..">
  là MỘT trạng thái phẳng (flat-image KSvg.FrameSvg, không phải 9-patch —
  đối chiếu src/qml/AuroraeButton.qml dùng FrameSvgItem{ prefix: "active" |
  "hover" | "pressed" | "inactive" | "hover-inactive" | "pressed-inactive" |
  "deactivated" | "deactivated-inactive" }, engine tự kiểm tra
  hasElementPrefix(prefix) nên theme chỉ cần cung cấp trạng thái nào có,
  thiếu thì rơi về "active"). Bỏ qua "deactivated*" (nút đóng hiếm khi bị
  khoá) theo đúng phạm vi đặc tả (chỉ yêu cầu hover/pressed/inactive).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">

  <!-- active = trạng thái bình thường, cửa sổ đang focus -->
  <g id="active">
    <circle cx="10" cy="10" r="9" fill="#D94D43"/>
  </g>

  <!-- hover = sáng hơn -->
  <g id="hover">
    <circle cx="10" cy="10" r="9" fill="#F26A52"/>
  </g>

  <!-- pressed = sáng hơn nữa (bấm giữ) -->
  <g id="pressed">
    <circle cx="10" cy="10" r="9" fill="#FF8B6C"/>
  </g>

  <!-- inactive = cửa sổ mất focus -> xám nhạt -->
  <g id="inactive">
    <circle cx="10" cy="10" r="9" fill="#D7DBE0" stroke="#B9C0C7" stroke-width="0.6"/>
  </g>

  <!-- hover/pressed khi cửa sổ đang inactive nhưng con trỏ rê/bấm vào nút:
       PHẢI có, nếu không nút sẽ biến mất (trống) lúc hover — xem auroraetheme
       logic trong AuroraeButton.qml (buttonInactive yêu cầu !hovered). -->
  <g id="hover-inactive">
    <circle cx="10" cy="10" r="9" fill="#E2E5E9" stroke="#B9C0C7" stroke-width="0.6"/>
  </g>
  <g id="pressed-inactive">
    <circle cx="10" cy="10" r="9" fill="#C3C8CE" stroke="#AAB1B9" stroke-width="0.6"/>
  </g>

</svg>
