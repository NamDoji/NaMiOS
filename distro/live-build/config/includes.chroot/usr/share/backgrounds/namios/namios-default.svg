<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!--
    NaMiOS — hình nền desktop mặc định. TỰ THIẾT KẾ cho dự án (không dùng tài
    sản Microsoft). Tông navy + nhấn ruby thương hiệu, trung tính để hợp cả
    theme sáng/tối Plasma. Render PNG kèm theo (namios-default.png). verified_on_boot: NO.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#132a4c"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <radialGradient id="ruby" cx="0.82" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <rect width="2560" height="1440" fill="url(#ruby)"/>
  <rect width="2560" height="1440" fill="url(#teal)"/>

  <!-- vòng cung trừu tượng nhẹ -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <circle cx="2040" cy="300" r="520"/>
    <circle cx="2040" cy="300" r="360"/>
    <circle cx="2040" cy="300" r="680"/>
  </g>
  <circle cx="430" cy="1180" r="520" fill="#ffffff" opacity="0.02"/>

  <!-- monogram NaMiOS ở giữa, rất nhẹ -->
  <g transform="translate(1280,720)" opacity="0.9">
    <rect x="-96" y="-96" width="192" height="192" rx="46" fill="url(#mark)" opacity="0.92"/>
    <text x="0" y="40" font-family="Noto Sans, sans-serif" font-size="118" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
  </g>
  <text x="1280" y="900" font-family="Noto Sans, sans-serif" font-size="46" font-weight="700" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="2">NaMiOS</text>
  <text x="1280" y="946" font-family="Noto Sans, sans-serif" font-size="22" fill="#9fb0d0" text-anchor="middle" letter-spacing="1">Hệ điều hành cho người Việt</text>
</svg>
