<?xml version="1.0" encoding="UTF-8"?>
<!--
  NaMiOS-Sen / widgets/panel-background.svg
  Nen cho Panel (taskbar/dock). Cung schema 9-slice nhu widgets/background.svg
  (xem file do de biet chi tiet quy uoc id). Panel container cua Plasma Shell
  tu dong chi dung cac margin/canh lien quan toi canh man hinh ma panel dang
  neo (vd panel neo duoi man hinh se khong bo-goc/mo canh duoi giap vien man
  hinh) — logic do nam trong PlasmaCore Panel View, KHONG can xu ly rieng trong
  file SVG nay; file nay chi can cung cap du 9 manh + hint margin chuan.
  Mau/kinh mo giong het widgets/background.svg de dong bo panel + dock + menu.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect id="hint-top-margin" x="0" y="0" width="128" height="36" fill="#000000" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="0" y="92" width="128" height="36" fill="#000000" fill-opacity="0"/>
  <rect id="hint-left-margin" x="0" y="0" width="36" height="128" fill="#000000" fill-opacity="0"/>
  <rect id="hint-right-margin" x="92" y="0" width="36" height="128" fill="#000000" fill-opacity="0"/>

  <path id="topleft" d="M36,0 L28,0 A28,28 0 0 0 0,28 L0,36 L36,36 Z" fill="#10202E" fill-opacity="0.72"/>
  <path id="topright" d="M92,0 L100,0 A28,28 0 0 1 128,28 L128,36 L92,36 Z" fill="#10202E" fill-opacity="0.72"/>
  <path id="bottomleft" d="M36,128 L28,128 A28,28 0 0 1 0,100 L0,92 L36,92 Z" fill="#10202E" fill-opacity="0.72"/>
  <path id="bottomright" d="M92,128 L100,128 A28,28 0 0 0 128,100 L128,92 L92,92 Z" fill="#10202E" fill-opacity="0.72"/>

  <rect id="top" x="36" y="0" width="56" height="36" fill="#10202E" fill-opacity="0.72"/>
  <rect id="bottom" x="36" y="92" width="56" height="36" fill="#10202E" fill-opacity="0.72"/>
  <rect id="left" x="0" y="36" width="36" height="56" fill="#10202E" fill-opacity="0.72"/>
  <rect id="right" x="92" y="36" width="36" height="56" fill="#10202E" fill-opacity="0.72"/>

  <rect id="center" x="36" y="36" width="56" height="56" fill="#10202E" fill-opacity="0.72"/>
</svg>
