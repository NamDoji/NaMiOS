<?xml version="1.0" encoding="UTF-8"?>
<!--
  NaMiOS-Sen / widgets/tooltip.svg
  Nen cho tooltip (hover tren icon panel/plasmoid). Canvas nho hon (60x60), vien
  day 18px, ban kinh bo goc 14px (= bien r-md trong namios.css) — tooltip nho nen
  bo goc vua phai, khong dung r-xl nhu panel/dialog. Cung mau kinh mo navy 0.72.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <rect id="hint-top-margin" x="0" y="0" width="60" height="18" fill="#000000" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="0" y="42" width="60" height="18" fill="#000000" fill-opacity="0"/>
  <rect id="hint-left-margin" x="0" y="0" width="18" height="60" fill="#000000" fill-opacity="0"/>
  <rect id="hint-right-margin" x="42" y="0" width="18" height="60" fill="#000000" fill-opacity="0"/>

  <path id="topleft" d="M18,0 L14,0 A14,14 0 0 0 0,14 L0,18 L18,18 Z" fill="#10202E" fill-opacity="0.72"/>
  <path id="topright" d="M42,0 L46,0 A14,14 0 0 1 60,14 L60,18 L42,18 Z" fill="#10202E" fill-opacity="0.72"/>
  <path id="bottomleft" d="M18,60 L14,60 A14,14 0 0 1 0,46 L0,42 L18,42 Z" fill="#10202E" fill-opacity="0.72"/>
  <path id="bottomright" d="M42,60 L46,60 A14,14 0 0 0 60,46 L60,42 L42,42 Z" fill="#10202E" fill-opacity="0.72"/>

  <rect id="top" x="18" y="0" width="24" height="18" fill="#10202E" fill-opacity="0.72"/>
  <rect id="bottom" x="18" y="42" width="24" height="18" fill="#10202E" fill-opacity="0.72"/>
  <rect id="left" x="0" y="18" width="18" height="24" fill="#10202E" fill-opacity="0.72"/>
  <rect id="right" x="42" y="18" width="18" height="24" fill="#10202E" fill-opacity="0.72"/>

  <rect id="center" x="18" y="18" width="24" height="24" fill="#10202E" fill-opacity="0.72"/>
</svg>
