<?xml version="1.0" encoding="UTF-8"?>
<!--
  NaMiOS-Sen / opaque/widgets/background.svg
  Ban KHONG-trong-suot cua ../../widgets/background.svg. Plasma::FrameSvg tu
  dong chon file trong thu muc opaque/ khi KWin compositing TAT (vd chay trong
  QEMU/TCG khong co GPU accel) — luc do kinh mo/blur khong the hien thi, neu
  van dung file co alpha se bi "nhin xuyen" ra desktop phia sau rat xau; file
  nay dung fill-opacity=1 (navy dac #0B2034) de luon ra dung mau + bo goc dù
  compositing tat. Cung schema 9-slice/id voi ban goc.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect id="hint-top-margin" x="0" y="0" width="128" height="36" fill="#000000" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="0" y="92" width="128" height="36" fill="#000000" fill-opacity="0"/>
  <rect id="hint-left-margin" x="0" y="0" width="36" height="128" fill="#000000" fill-opacity="0"/>
  <rect id="hint-right-margin" x="92" y="0" width="36" height="128" fill="#000000" fill-opacity="0"/>

  <path id="topleft" d="M36,0 L28,0 A28,28 0 0 0 0,28 L0,36 L36,36 Z" fill="#0B2034" fill-opacity="1"/>
  <path id="topright" d="M92,0 L100,0 A28,28 0 0 1 128,28 L128,36 L92,36 Z" fill="#0B2034" fill-opacity="1"/>
  <path id="bottomleft" d="M36,128 L28,128 A28,28 0 0 1 0,100 L0,92 L36,92 Z" fill="#0B2034" fill-opacity="1"/>
  <path id="bottomright" d="M92,128 L100,128 A28,28 0 0 0 128,100 L128,92 L92,92 Z" fill="#0B2034" fill-opacity="1"/>

  <rect id="top" x="36" y="0" width="56" height="36" fill="#0B2034" fill-opacity="1"/>
  <rect id="bottom" x="36" y="92" width="56" height="36" fill="#0B2034" fill-opacity="1"/>
  <rect id="left" x="0" y="36" width="36" height="56" fill="#0B2034" fill-opacity="1"/>
  <rect id="right" x="92" y="36" width="36" height="56" fill="#0B2034" fill-opacity="1"/>

  <rect id="center" x="36" y="36" width="56" height="56" fill="#0B2034" fill-opacity="1"/>
</svg>
