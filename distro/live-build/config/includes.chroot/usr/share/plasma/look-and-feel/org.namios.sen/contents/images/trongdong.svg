<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Hoa văn lấy cảm hứng trống đồng Đông Sơn">
  <title>NaMiOS — Hoạ tiết trống đồng (watermark)</title>
  <desc>Hoạ tiết hình học lấy cảm hứng Ở MỨC Ý TƯỞNG VĂN HOÁ CHUNG từ các mô-típ dân gian cổ xuất hiện trên nhiều mặt trống đồng Đông Sơn (ngôi sao nhiều cánh ở tâm, các vòng tròn đồng tâm, răng cưa/tam giác, hàng chấm) — vẽ lại hoàn toàn bằng công thức hình học/lượng giác của riêng tài sản này, KHÔNG sao chép, KHÔNG dựa trên ảnh chụp của bất kỳ trống đồng thật/hiện vật bảo tàng cụ thể nào. WAVE "ĐÔNG SƠN" 11/11/2026: đổi từ 2 sắc vàng v2 "vàng tấm" #F2C66D / "vàng nước" #BC8A43 sang DUY NHẤT 1 màu vàng v3 "NaMiOS Đông Sơn" #DEA93E (bảng remap chính thức gộp cả 2 mã cũ về 1 mã mới — chấp nhận watermark bớt 1 lớp sắc độ, đổi lại nhất quán đúng palette v3 trên nền navy mới) trên nền trong suốt, không gradient/filter (an toàn render ở ngữ cảnh software/splash boot). Dùng làm watermark độ mờ thấp phía sau Splash.qml trên nền navy — xem usr/share/namios/docs/SPLASH.md.</desc>

