# NaMiOS — theme.conf cho theme SDDM rieng "namios". Dinh dang INI, ket cau
# section/key gioi han boi SDDM (SDDM/KPackage doc qua [General]); comment
# "#" o dong rieng — da xac nhan AN TOAN vi chinh file da ton tai trong repo
# nay dung cung kieu comment nay (xem
# includes.chroot/usr/share/sddm/themes/breeze/theme.conf.user, header dai).
#
# background/backgroundColor: DUONG DAN THAM CHIEU — day la PHU THUOC vao
# nhom wallpaper (ho san xuat/cap nhat anh nen man hinh dang nhap). File
# namios-default.png DUOI DAY DA CO SAN trong includes.chroot (dung lam nen
# SDDM theme "breeze" hien tai qua theme.conf.user, xem file do) nen KHONG
# phai anh bia moi — chi THAM CHIEU LAI cung duong dan that da dung. Neu
# nhom wallpaper sau nay doi ten/duong dan anh nen DANH RIENG cho man hinh
# dang nhap (khac voi anh nen desktop), CAN sua key "background" o day cho
# khop — ghi lai la PHU THUOC CAN THEO DOI, khong phai gia dinh vinh vien.
#
# backgroundColor la LUOI AN TOAN mau mục đêm (#122A3A, brand.json) —
# Background.qml trong theme nay LUON ve mau nay LOT DUOI anh truoc
# (Rectangle fill), Image chi hien khi tai thanh cong (status===Ready) ->
# anh nen thieu/hong => man hinh VAN la mau mực đêm, KHONG BAO GIO
# den/trong. Day la cai thien so voi rui ro da ghi nhan o theme.conf.user
# cua breeze ("Background.qml KHONG tu dong fallback ve mau... RUI RO: man
# hinh co the trong/den neu file khong ton tai") — theme nay (Background.qml
# tu viet) KHONG co lo hong do.
#
# verified_on_host: NO — cac gia tri mau/font da kiem tra khop
# usr/share/namios-branding/logo/brand.json (v2 "Sen Viet", nguon mau DUY
# NHAT cua toan OS) nhung CHUA xac nhan SDDM/Qt doc dung tren may/QEMU that.
[General]
background=/usr/share/backgrounds/namios/namios-default.png
backgroundColor=#122A3A
accentColor=#C93643
goldColor=#F2C66D
foregroundColor=#F7F6F1
foregroundDimColor=#B7C4CF
fontFamily=Inter
showClock=true
