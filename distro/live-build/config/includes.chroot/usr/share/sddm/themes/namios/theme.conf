# NaMiOS — theme.conf cho theme SDDM rieng "namios". Dinh dang INI, ket cau
# section/key gioi han boi SDDM (SDDM/KPackage doc qua [General]); comment
# "#" o dong rieng — da xac nhan AN TOAN vi chinh file da ton tai trong repo
# nay dung cung kieu comment nay (xem
# includes.chroot/usr/share/sddm/themes/breeze/theme.conf.user, header dai).
#
# WAVE "DONG SON" 11/11/2026 (nhiem vu rieng giao cho system-screens dev —
# thay bo nhan dien BOOT/LOGIN/SPLASH tu v2 "Sen Viet" sang v3 "Dong Son"):
# nguoi giao nhiem vu xac nhan RO RANG palette "NaMiOS v3 Dong Son" (navy
# #092D4F lam NEN man hinh dang nhap/khoi dong/splash — day la SIEU-XI
# (supersede) co chu dich quyet dinh 09/11/2026 "sen quy khong dat nen den"
# CHI cho 3 mat nay; wallpaper desktop mac dinh/man hinh About KHONG doi o
# day). Doi toan bo 4 mau fallback ben duoi theo bang remap chinh thuc duoc
# giao kem nhiem vu:
#   #122A3A (navy v2) -> #092D4F (navy v3)
#   #C93643 (do-son v2, "accent") -> #D64C3E (vermilion v3, "action")
#   #F2C66D (vang-tam v2) -> #DEA93E (vang v3, "progress/signature accent")
#   #F7F6F1 (ngoc-trai v2) -> #FFF9EF (ivory v3)
# foregroundDimColor #B7C4CF GIU NGUYEN — da tinh lai contrast tren navy v3
# moi (#092D4F): 7.87:1, VAN dat WCAG AA (>=4.5:1 van ban nho/thuong) nen
# khong can doi, xem tinh toan luc thuc hien (11/11/2026).
#
# background: THAY duong dan tham chieu ra ngoai (/usr/share/backgrounds/
# namios/namios-default.png, phu thuoc nhom wallpaper, da ghi chu rui ro
# "CAN THEO DOI" o ban truoc) bang 1 anh TU CHUA trong chinh theme nay —
# namios-login-background.png, sinh boi
# branding/dongson-v3-render/make_sddm_login_bg_v3.py (Pillow — sandbox
# khong co SVG rasterizer, xem docstring file do). Day la ban "reproduce"
# cua branding/kit/NaMi_Brand_DongSon_v1/04_system_screens/login-background.png
# (cung toa do/mau navy+song+bieu tuong) nhung DA BO 3 dong chu tinh "NaMi"/
# "Xin chao"/"Dang nhap de tiep tuc" ma anh kit goc ve san — vi Main.qml
# (cung sua trong wave nay) da chuyen khoi dang nhap that (dong ho+danh sach
# nguoi dung+o mat khau+nut) xuong 1/3 duoi man hinh, ngay duoi vung bieu
# tuong; neu ghep thang PNG kit goc (co chu tinh nam dung giua man hinh) se
# chong chu that/chu tinh — trai nguyen tac "khong chen hinh splash tinh nhu
# UI tuong tac" (06_implementation/CLAUDE_CODE_PROMPT.md). Day la THAY DOI CO
# CHU DICH, da ghi ro ly do o day de nguoi doc sau khong tuong nham thieu sot.
#
# backgroundColor la LUOI AN TOAN mau navy v3 (#092D4F) — Background.qml
# trong theme nay LUON ve mau nay LOT DUOI anh truoc (Rectangle fill), Image
# chi hien khi tai thanh cong (status===Ready) -> anh nen thieu/hong => man
# hinh VAN la mau navy, KHONG BAO GIO den/trong. Day la cai thien so voi rui
# ro da ghi nhan o theme.conf.user cua breeze ("Background.qml KHONG tu dong
# fallback ve mau... RUI RO: man hinh co the trong/den neu file khong ton
# tai") — theme nay (Background.qml tu viet) KHONG co lo hong do.
#
# verified_on_host: NO — cac gia tri mau/font da tu tinh toan contrast WCAG
# (xem ghi chu tren) nhung CHUA xac nhan SDDM/Qt doc dung tren may/QEMU that.
[General]
background=/usr/share/sddm/themes/namios/namios-login-background.png
backgroundColor=#092D4F
accentColor=#D64C3E
goldColor=#DEA93E
foregroundColor=#FFF9EF
foregroundDimColor=#B7C4CF
fontFamily=Inter
showClock=true
