<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  WP7 — D-Bus system-bus policy mẫu cho org.namios.SystemHelper1
  (SEC-001, CLI-004). File MẪU đóng gói-thời-điểm cho
  /etc/dbus-1/system.d/ (chưa cài thật tại M1 — system bus không chạy ở
  host build headless hiện tại; cài thật là bước packaging M3).

  Mặc định TỪ CHỐI tất cả; chỉ cho phép sở hữu tên bus bởi user hệ thống
  chuyên dụng (root khởi động service, hạ quyền nội bộ nếu cần) và cho
  phép MỌI user gửi method call tới 4 method typed (vì chính Polkit action
  per-method ở trên mới là lớp kiểm soát quyền thật — D-Bus policy ở đây
  chỉ kiểm soát AI được quyền NÓI CHUYỆN với service, không phải ai được
  quyền THỰC HIỆN hành động).
-->
<busconfig>
  <policy user="root">
    <allow own="org.namios.SystemHelper1"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.namios.SystemHelper1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.namios.SystemHelper1"
           send_interface="org.namios.SystemHelper1"
           send_member="GetSystemCapabilities"/>
    <allow send_destination="org.namios.SystemHelper1"
           send_interface="org.namios.SystemHelper1"
           send_member="GetUpdateStatus"/>
    <allow send_destination="org.namios.SystemHelper1"
           send_interface="org.namios.SystemHelper1"
           send_member="PlanPackageInstall"/>
    <allow send_destination="org.namios.SystemHelper1"
           send_interface="org.namios.SystemHelper1"
           send_member="ApplyApprovedPackagePlan"/>
    <!-- CỐ Ý KHÔNG có allow cho send_member="RunCommand" hay bất kỳ
         method nào ngoài 4 method typed trên. -->
  </policy>

  <policy context="default">
    <allow send_destination="org.namios.SystemHelper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.namios.SystemHelper1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
