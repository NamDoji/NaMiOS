# NaMiOS — GHI CHÚ TÙY CHỌN, RỦI RO CAO. KHÔNG đề xuất đưa vào ảnh mặc
# định (package-lists/*.chroot) ở wave này. Đây là thông tin để Cuong CÂN
# NHẮC, không phải cấu hình sẵn-ghép.
#
# ════════════════════════════════════════════════════════════════════
# 1) BO GÓC TOÀN KHUNG CỬA SỔ (nội dung + viền, kiểu macOS/iPadOS thật)
# ════════════════════════════════════════════════════════════════════
# SỰ THẬT: KWin 6 (bản 6.3.x trong Debian 13 trixie) KHÔNG có hiệu ứng này
# built-in. Plasma 6.5 (07/2025) mới thêm "rounded BOTTOM corners" (chỉ góc
# dưới, built-in vào Breeze decoration) — trixie KHÔNG có bản này.
#
# Dự án ngoài tồn tại thật, tên thật, verify được:
#   - matinlotfali/KDE-Rounded-Corners (trước gọi "ShapeCorners")
#     https://github.com/matinlotfali/KDE-Rounded-Corners
#     Tương thích công bố: Plasma 5.27 → 6.6+, cả X11 lẫn Wayland.
#     Có .deb dựng sẵn cho "Debian" + PPA Kubuntu, HOẶC build từ mã nguồn
#     (cần gói kwin-dev, qt6-base-private-dev, qt6-base-dev-tools,
#     libkf6kcmutils-dev, extra-cmake-modules — build cờ -DKWIN_X11=ON cho
#     phiên X11 mà NaMiOS đang dùng).
#   - alex47/KDE-Rounded-Corners (fork khác cùng ý tưởng).
#
# VÌ SAO KHÔNG ĐỀ XUẤT ĐƯA VÀO ẢNH MẶC ĐỊNH NGAY:
#   a) Đây là PLUGIN KWin biên dịch native (C++/OpenGL shader), không phải
#      "chỉ config" — ngược với yêu cầu "LUẬT SỐ 1 = AN TOÀN BOOT, chỉ
#      config". Một plugin KWin lỗi/ABI lệch có thể làm KWin crash khi
#      compositing bật lên (đúng đúng lúc mục tiêu auto-compositing của
#      wave này muốn bật) — rủi ro ngay tại đúng điểm nhạy cảm nhất.
#   b) .deb dựng sẵn của dự án KHÔNG chắc khớp ABI đúng với bản
#      kwin/libkwineffects của Debian trixie (họ build cho Kubuntu/openSUSE
#      Tumbleweed là chính) — rủi ro nạp lỗi/không nạp được (họ có cảnh báo
#      rõ: hiệu ứng binary "break on every KWin update", phải rebuild).
#   c) NaMiOS từng có sự cố nghi do 1 theme/decoration (Aurorae NaMiOSLotus)
#      làm kẹt phiên đăng nhập (xem comment trong kwinrc thật, commit
#      7ab9958 "khôi phục boot — tách Plasma theme + Aurorae deco"). Thêm
#      1 plugin KWin biên dịch riêng NGAY SAU sự cố đó, CHƯA điều tra xong
#      nguyên nhân cũ, là cộng dồn rủi ro không cần thiết.
#
# NẾU MUỐN THEO HƯỚNG NÀY (sau này, khi có build host Debian 13 trixie
# thật + đã boot ổn định): build TỪ MÃ NGUỒN ngay trên build host (không
# dùng .deb dựng sẵn của họ) để khớp đúng kwin-dev của trixie, đưa qua 1
# spike riêng (kiểu ADR 0002 đã làm) với tiêu chí chấp nhận = login được
# N lần liên tục không crash, TRƯỚC khi cân nhắc đưa vào package-lists.
#
# PHƯƠNG ÁN THAY THẾ RỦI RO THẤP HƠN NHIỀU (khuyến nghị thay vì mục 1):
# NaMiOS TỰ VẼ khung cửa sổ bo góc bằng Aurorae SVG (theme NaMiOS Lotus đã
# dựng ở usr/share/aurorae/themes/NaMiOSLotus, đang TẮT tạm thời) — Aurorae
# là cơ chế CHÍNH THỐNG của KWin (không phải plugin ngoài), chỉ bo góc được
# phần KHUNG/titlebar (không bo được nội dung bên trong app), và cần
# compositing bật để góc bo hiện đúng (trong suốt thật) thay vì hiện vuông/
# nhiễu ở góc. Việc này phụ thuộc điều tra xong nguyên nhân sự cố đăng
# nhập cũ trước — KHÔNG nằm trong phạm vi wave đề xuất này, chỉ ghi chú để
# Cuong biết đây là bước TIẾP THEO hợp lý hơn plugin ngoài.
#
# ════════════════════════════════════════════════════════════════════
# 2) PHÓNG ICON DOCK KHI HOVER (xem thêm namios-panel-polish.sh)
# ════════════════════════════════════════════════════════════════════
# Xem ghi chú đầy đủ ở cuối usr-local-bin/namios-panel-polish.sh trong
# cùng thư mục đề xuất này. Tóm tắt: Latte Dock gốc ngừng phát triển/không
# chạy Plasma 6; fork cộng đồng "Lattecotta Dock" chỉ chạy Wayland trong
# khi NaMiOS đang ép phiên X11 (plasmax11) — không khớp kiến trúc hiện tại.
# Plasmoid Task Manager zoom cộng đồng (QML) là lựa chọn nhẹ rủi ro hơn
# nhưng vẫn ngoài Debian repos, chưa kiểm tương thích. ĐỀ XUẤT: bỏ qua ở
# wave này.
