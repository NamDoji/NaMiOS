# NaMiOS — ĐỀ XUẤT bổ sung vào file thật
# distro/live-build/config/includes.chroot/etc/skel/.config/kwinrc
# (CHƯA ghép — file thật hiện chỉ có [ModifierOnlyShortcuts] +
# [Compositing] Enabled=false,OpenGLIsUnsafe=true + comment Aurorae).
#
# TOÀN BỘ section [Plugins] dưới đây CHỈ có tác dụng khi [Compositing]
# Enabled=true — tức là CHỈ trên máy có GPU thật, SAU KHI
# usr-local-bin/namios-auto-compositing.sh (cùng thư mục đề xuất này) đã
# chạy và bật Enabled=true. Dưới QEMU/TCG hiện tại (Enabled=false), ghi các
# khoá này vào kwinrc KHÔNG đổi gì cả — vô hại, chỉ là cấu hình "chờ sẵn".
#
# verified_on_host: NO cho MỌI khoá dưới đây. Tên khoá soạn theo tài liệu +
# nhiều bản kwinrc thật đã đối chiếu (Fedora KDE setup script dùng đúng lệnh
# `kwriteconfig6 --file kwinrc --group Plugins --key blurEnabled true`; dự
# án plasma-liquid-glass — hiệu ứng "kính lỏng" kiểu iOS cho Plasma 6 —
# cũng dùng blurEnabled+contrastEnabled làm nền. KHÔNG đối chiếu được trên
# desktop Plasma thật của NaMiOS (host dựng này không có desktop session).
# CÁCH VERIFY ĐÚNG (khi có máy thật): mở Cài đặt hệ thống > Hiệu ứng màn
# hình, bật/tắt từng hiệu ứng bằng tay, rồi `diff` kwinrc trước/sau để xác
# nhận đúng tên khoá — KHÔNG tin suông comment này.

[Plugins]
# --- "Kính mờ" (mục 2 trong yêu cầu) — 2 hiệu ứng built-in KWin 6, KHÔNG
# phải plugin ngoài, đi kèm gói kwin sẵn có trong task-kde-desktop. Blur làm
# mờ nền sau panel/launcher trong suốt; Contrast ("Background Contrast")
# tăng tương phản chữ TRÊN vùng đã blur — thiếu Contrast thì chữ trên kính
# mờ dễ khó đọc (đúng tinh thần glass của branding/style/namios.css
# --blur: saturate(180%) blur(30px)).
blurEnabled=true
contrastEnabled=true

# --- Chuyển động mượt (mục 1) — hiệu ứng built-in bật tường minh để không
# phụ thuộc giá trị mặc định có thể đổi giữa các bản KWin:
# Scale = hiệu ứng mở/đóng cửa sổ phóng to/nhỏ mượt (thay Fade cũ, đã là
#   effect "Scale" mặc định từ Plasma 5.19, xem System Settings > Hiệu ứng
#   > "Scale"); để mặc định KWin (không ghi tắt) vì thường đã bật sẵn —
#   liệt kê ở đây để tài liệu hoá ý định, verify bằng cách bật tay rồi diff.
scaleEnabled=true
# Slide = chuyển desktop ảo trượt mượt (không giật).
slideEnabled=true
# Slide cho popup/tooltip/thông báo trượt nhẹ thay vì bật phựt.
slidingpopupsEnabled=true

# --- "Wobbly off (không kiểu cũ)" — Wobbly Windows là hiệu ứng rung lắc
# kiểu Compiz 2008; mặc định KWin 6 đã TẮT, ghi tường minh=false để chắc
# chắn không ai vô tình bật (vd người dùng bấm nhầm trong danh sách Hiệu
# ứng), đúng yêu cầu "không kiểu cũ".
wobblywindowsEnabled=false
# Cube/CubeSlide chuyển desktop kiểu hộp xoay 3D — cũng là phong cách "cũ"
# (Compiz-era), không hợp hướng iPadOS phẳng/mượt của NaMiOS. Mặc định tắt,
# ghi tường minh để chắc chắn.
cubeslideEnabled=false

# --- GHI CHÚ TRUNG THỰC — "bo góc" (rounded corners), mục 3 trong yêu cầu:
# KHÔNG có khoá kwinrc nào ở đây cho rounded-corners toàn khung cửa sổ (nội
# dung + viền), vì KWin 6.3 (bản Plasma trong Debian 13 trixie — xác nhận
# qua gói breeze-cursor-theme phiên bản 4:6.3.5-1 trên packages.debian.org)
# KHÔNG có hiệu ứng này built-in. KDE chỉ thêm "rounded BOTTOM corners"
# (chỉ góc dưới, không phải toàn khung) built-in vào Breeze decoration kể
# từ Plasma 6.5 (phát hành ~07/2025, xem blogs.kde.org "This Week in Plasma:
# rounded bottom corners") — TRIXIE KHÔNG CÓ bản 6.5 này (đóng băng ở
# 6.3.x), nên tính năng đó KHÔNG áp dụng được cho NaMiOS trừ khi lên bản
# Debian sau này. Xem thêm ghi chú riêng trong file
# OPTIONAL-rounded-corners-and-dock-zoom.notes.ini (lựa chọn plugin ngoài,
# RỦI RO CAO, KHÔNG đề xuất đưa vào ảnh mặc định).
