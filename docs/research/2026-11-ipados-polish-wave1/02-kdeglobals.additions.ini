# NaMiOS — ĐỀ XUẤT bổ sung vào file thật
# distro/live-build/config/includes.chroot/etc/skel/.config/kdeglobals
# (file thật hiện có [KDE] SingleClick=false,widgetStyle=Breeze +
# [General] màu/font + [Icons] Theme=NaMiOS-Lotus — CHƯA có khoá dưới đây).
#
# Thêm 1 khoá vào section [KDE] ĐÃ CÓ sẵn (không tạo section mới):
#
# [KDE]
# AnimationDurationFactor=1.0
#
# Ý nghĩa (xác nhận qua tài liệu KDE + báo cáo lỗi bugs.kde.org #423571):
# - Giá trị nhân với thời lượng mọi animation Plasma/Qt Quick/Kirigami
#   (KHÔNG riêng KWin). 0 = tắt hẳn animation (giật cục, kiểu "giảm chuyển
#   động" accessibility). 1.0 = tốc độ chuẩn KDE. >1.0 = chậm hơn (dùng khi
#   debug/demo), <1.0 = nhanh hơn.
# - 1.0 là lựa chọn AN TOÀN cho máy thật có GPU (mục tiêu "mượt như
#   iPadOS" không cần animation nhanh bất thường, cứ theo tốc độ KDE mặc
#   định đã được KDE tinh chỉnh kỹ).
# - Máy yếu / VM không GPU: KHÔNG cần đổi riêng — animation Qt Quick vẫn
#   chạy được bằng software (QT_QUICK_BACKEND=software đã ép ở hook 0400),
#   chỉ là animation phần mềm sẽ chậm hơn theo CPU, không phải do
#   AnimationDurationFactor. Nếu máy yếu bị giật, hạ xuống 0.5-0.7 thay vì
#   0 (0 làm mất hẳn cảm giác "mượt" NaMiOS muốn có, chỉ nên dùng 0 cho nhu
#   cầu accessibility "giảm chuyển động" rõ ràng, không phải cho máy yếu).
#
# CẢNH BÁO ĐÃ XÁC NHẬN (bugs.kde.org #431259 "AnimationDurationFactor is
# inappropriately present in kwinrc file and gets evaluated, overriding the
# value in kdeglobals"): TUYỆT ĐỐI KHÔNG đặt thêm khoá AnimationDurationFactor
# trong kwinrc (file 01-kwinrc.additions.ini đề xuất ở thư mục này KHÔNG có
# khoá này — cố tình). Chỉ đặt DUY NHẤT ở kdeglobals, nếu không 2 nơi đá
# nhau, hành vi animation sẽ khó đoán tuỳ phiên bản KWin.
#
# verified_on_host: NO — cần boot Plasma thật để xem animation có "mượt"
# đúng cảm giác mong muốn hay cần chỉnh lại con số (vd 0.8 thay vì 1.0 nếu
# vẫn thấy chậm/nặng trên phần cứng pilot cụ thể).
