# NaMiOS — ĐỀ XUẤT bổ sung vào file thật
# distro/live-build/config/includes.chroot/etc/skel/.config/kscreenlockerrc
# (file thật hiện chỉ có [Daemon] Autolock=false,LockOnResume=false,
# Timeout=0 — tắt HẲN tự khoá màn hình, lý do tránh màn khoá Breeze xanh
# Debian hiện ra giữa demo/chụp ảnh dưới QEMU).
#
# Lưu ý quan trọng: Autolock=false CHỈ tắt tự-khoá-khi-rảnh. Người dùng vẫn
# có thể tự khoá thủ công (Meta+L, hoặc menu Start > Khoá). Hiện màn khoá
# thủ công đó sẽ hiện nền Breeze mặc định (không phải thương hiệu NaMiOS)
# vì kscreenlockerrc chưa đặt Wallpaper riêng. Đề xuất thêm:
#
# [Greeter][Wallpaper][org.kde.image][General]
# Image=file:///usr/share/backgrounds/namios/namios-default.png
# FillMode=2
#
# (Cùng cấu trúc + cùng ảnh + cùng FillMode=2 "Scaled, Keep Proportions" đã
# dùng cho wallpaper desktop ở plasma-org.kde.plasma.desktop-appletsrc,
# group [Containments][2][Wallpaper][org.kde.image][General] — đồng bộ 2
# nơi dùng chung 1 ảnh, đúng mục 5 yêu cầu "khoá màn/lock + wallpaper đồng
# bộ look sen").
#
# verified_on_host: NO — cấu trúc group lồng [Greeter][Wallpaper][...] soạn
# theo tài liệu kscreenlocker (kscreenlockersettings.kcfg) + nhiều ví dụ
# cộng đồng dùng đúng lệnh
#   kwriteconfig5 --file kscreenlockerrc --group Greeter --group Wallpaper \
#     --group org.kde.image --group General --key Image "file://..."
# (Plasma 6 dùng kwriteconfig6, cùng cấu trúc group). CHƯA xác nhận trên
# desktop Plasma 6.3 thật của NaMiOS — PHẢI bấm Meta+L thử sau khi boot
# thật để xem màn khoá có hiện đúng ảnh namios-default.png hay rơi về mặc
# định (nếu rơi về mặc định: không hỏng gì, chỉ là chưa đổi được nền).
#
# RỦI RO: ĐỘ (gần như không) — chỉ là 1 khoá ảnh tĩnh, không liên quan
# compositing/GPU, áp dụng được cả trong QEMU/TCG lẫn máy thật, không phụ
# thuộc mục 1-3 (animation/blur/rounded-corners) ở các file khác trong thư
# mục đề xuất này.
