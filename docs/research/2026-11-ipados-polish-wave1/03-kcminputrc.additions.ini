# NaMiOS — ĐỀ XUẤT file MỚI (chưa tồn tại trong skel hiện tại):
# distro/live-build/config/includes.chroot/etc/skel/.config/kcminputrc
#
# Hiện NaMiOS KHÔNG đặt con trỏ chuột riêng -> dùng mặc định Plasma/SDDM
# (thường là breeze_cursors, do gói breeze kéo theo). Đây là 2 PHƯƠNG ÁN,
# chọn 1, KHÔNG áp cả hai:

# ── PHƯƠNG ÁN A (AN TOÀN, KHÔNG cần thêm gói) ──────────────────────────
# Giữ nguyên mặc định Breeze — không cần file kcminputrc nào cả. Breeze
# cursor theme (gói breeze-cursor-theme, có sẵn trong Debian 13 trixie,
# phiên bản 4:6.3.5-1 trên packages.debian.org) đã sạch/phẳng, hợp phong
# cách NaMiOS, zero rủi ro vì không đổi gì. ĐỀ XUẤT CHỌN PHƯƠNG ÁN NÀY cho
# bản đầu, trừ khi Cuong muốn con trỏ "tròn" rõ hơn (phương án B).

# ── PHƯƠNG ÁN B (cursor tròn hơn, kiểu iPadOS, cần thêm 1 gói) ─────────
# Gói bibata-cursor-theme CÓ trong Debian 13 trixie (packages.debian.org:
# phiên bản 2.0.6-1, gồm 6 biến thể Bibata Original/Modern × Amber/
# Classic/Ice). "Modern" = bo tròn góc (rounded edge) — hợp thẩm mỹ
# squircle/bo góc của namios.css hơn "Original" (sharp edge).
#
# Thêm vào distro/live-build/config/package-lists/0100-desktop-kde.list.chroot:
#   bibata-cursor-theme
#
# Rồi tạo file etc/skel/.config/kcminputrc:
# [Mouse]
# cursorTheme=Bibata-Modern-Ice
# cursorSize=24
#
# verified_on_host: NO cho giá trị "Bibata-Modern-Ice" — đây là TÊN THEO
# QUY ƯỚC thường thấy của bộ Bibata (thư mục index.theme bên trong gói),
# CHƯA xác nhận được chính xác trên gói Debian trixie thật (host dựng đề
# xuất này không cài được gói .deb để soi). BẮT BUỘC trước khi ghép:
#   apt-get install -y bibata-cursor-theme
#   dpkg -L bibata-cursor-theme | grep index.theme
# rồi lấy đúng tên thư mục (phần trước "/cursors/" hoặc "/cursor.theme")
# điền vào cursorTheme= — nếu sai tên, Plasma lặng lẽ rơi về cursor mặc
# định (KHÔNG crash, chỉ là không đổi được giao diện con trỏ).
#
# cursorSize=24 là cỡ chuẩn màn hình thường (96 DPI); màn hình 4K/scale
# cao nên tăng (vd 32 hoặc 48) — đây là lựa chọn theo máy, không có giá
# trị "đúng" chung cho mọi màn hình.
