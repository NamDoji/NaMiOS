động lại sau khi cài đặt.</p>${state.updateProgress>0?`<div class="progress" role="progressbar" aria-valuenow="${state.updateProgress}" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến trình cập nhật"><span style="width:${state.updateProgress}%"></span></div><p class="sub">${state.updateProgress>=100?'Đã hoàn tất bản mô phỏng · cần khởi động lại':'Đang chạy mô phỏng '+state.updateProgress+'% · không tải gói thật'}</p>`:button('Xem và cài đặt','run-update','primary')}</div><div class="card settings-list" style="margin-top:14px"><div class="setting"><div><strong>Tự động cập nhật bản bảo mật</strong><p>Cho phép tải và cài theo lịch bạn chọn</p></div><button class="toggle ${state.autoUpdate?'on':''}" data-action="auto-update" aria-label="Tự động cập nhật" aria-pressed="${state.autoUpdate}"></button></div><div class="setting"><div><strong>Lịch sử và khôi phục</strong><p>Xem bản đã cài và cách quay lại khi có lỗi</p></div>${button('Xem','history')}</div></div><p class="note" style="margin-top:14px">Prototype chỉ mô phỏng trạng thái. Bản phát hành phải xác minh chữ ký, tính toàn vẹn và rollback bằng dịch vụ cập nhật thực.</p></div>`)}function browser(){return win('NaMi Trình duyệt · Trang bắt đầu',`<div class="browser-bar"><span>← &nbsp; → &nbsp; ↻</span><input class="input" id="address" value="nami://bat-dau" aria-label="Địa chỉ trang" style="margin-left:10px"><button class="btn tiny" data-action="browser-go">Đi</button></div><div class="browser-page"><img src="${A}" alt="Biểu tượng NaMi"><h2>Khám phá cùng NaMi</h2><p class="sub">Tìm thông tin, làm việc, học tập và kết nối.</p><div class="row" style="margin-top:24px"><input class="input" id="webSearch" placeholder="Nhập địa chỉ hoặc tìm kiếm..." aria-label="Tìm trên web"><button class="btn primary" data-action="web-search">Tìm</button></div><p class="note" style="margin-top:25px;text-align:left">Đây là màn hình mẫu của launcher NaMi. Nếu bản phân phối dùng Firefox, cần ghi rõ Firefox là trình duyệt nền, giữ giấy phép và đường cập nhật của phần mềm gốc.</p></div>`)}function about(){return win('Giới thiệu NaMi',`<div class="status-page"><div class="about-logo"><img src="${A}" alt="Biểu tượng trống đồng NaMi"><div><span class="eyebrow">Máy tính cho người Việt</span><h1 class="h1">NaMi</h1><p class="sub">Một trải nghiệm máy tính đẹp, dễ dùng và rõ ràng.</p></div></div><div class="divider"></div><div class="grid two"><div class="card"><b>Phiên bản</b><p class="sub">Prototype 1.0 · 11/11/2026</p></div><div class="card"><b>Người sáng lập dự án</b><p class="sub">Đỗ Chí Cường · Đỗ Bảo Nam</p></div><div class="card"><b>Nhận diện</b><p class="sub">Trống đồng cách điệu · Sóng chuyển động</p></div><div class="card"><b>Nguồn mở & giấy phép</b><p class="sub">Bản phát hành phải liệt kê thành phần, tác giả và giấy phép thực tế.</p></div></div><div class="divider"></div><p class="sub">Đây là giao diện mẫu, chưa phải hệ điều hành đã triển khai hay bằng chứng phần mềm/thiết bị tương thích.</p></div>`)}function installer(){return `<div class="hero-install"><div class="install-card"><div class="install-art"><div><b>NaMi</b><p style="line-height:1.6">Máy tính dễ dùng<br>cho người Việt</p></div><img src="${AD}" alt="Biểu tượng NaMi"><span class="small">Từ trải nghiệm đầu tiên</span></div><div class="install-right"><span class="eyebrow">Bước ${state.installStep+1} / 3</span><h1 class="h1" style="margin-top:18px">${['Chào mừng đến với NaMi','Kiểm tra trước khi cài','Xem lại lựa chọn'][state.installStep]}</h1><p class="sub">${['Chọn ngôn ngữ và bắt đầu khám phá hệ điều hành.','Kiểm tra ổ đĩa, nguồn và kết nối trước khi thay đổi máy.','Bản thật phải hiển thị phân vùng và dữ liệu có thể bị xóa trước xác nhận.'][state.installStep]}</p><div class="divider"></div>${state.installStep===0?`<label class="small"><b>Ngôn ngữ</b><select class="input" style="margin-top:8px"><option>Tiếng Việt</option><option>English</option></select></label><div class="card" style="margin-top:20px">✓ Bàn phím tiếng Việt &nbsp; · &nbsp; ✓ Hỗ trợ truy cập</div>`:state.installStep===1?`<div class="card"><p>✓ Đủ dung lượng cài đặt <span class="muted small">(minh họa)</span></p><p>✓ Nguồn điện đã kết nối <span class="muted small">(minh họa)</span></p><p>◉ Mạng Wi‑Fi đang khả dụng <span class="muted small">(minh họa)</span></p></div>`:`<div class="note"><b>Lưu ý dữ liệu:</b> Prototype không thay đổi ổ đĩa. Trình cài thật phải hiển thị rõ thiết bị, phân vùng, tác động và xác nhận riêng.</div>`}<div class="row" style="margin-top:30px">${state.installStep?button('Quay lại','install-back'):''}${button(state.installStep===2?'Xem desktop mẫu':'Tiếp tục',state.installStep===2?'install-finish':'install-next','primary')}</div></div></div></div>`}function login(){return `<div class="login"><div class="login-box"><img src="${A}" alt="NaMi"><div class="avatar">A</div><h2 class="h2">Xin chào, An</h2><p class="sub">Nhập mật khẩu để tiếp tục</p><input class="input" type="password" id="password" placeholder="Mật khẩu" aria-label="Mật khẩu"><button class="btn primary" data-action="login">Đăng nhập</button><p class="small muted">Tiếng Việt (Telex) · Wi‑Fi kết nối · Trợ năng</p></div></div>`}function render(){let sel=$('#screenSelect');if(sel)sel.value=state.screen;let special=['installer','login'].includes(state.screen);let c=special?(state.screen==='installer'?installer():login()):desktopBase()+(state.screen==='desktop'?office():state.screen==='office'?office():state.screen==='catalog'?catalog():state.screen==='files'?files():state.screen==='settings'?settings():state.screen==='update'?update():state.screen==='browser'?browser():about())+toolbar()+(state.start?startPanel():'')+(state.quick?quickPanel():'')+(state.ai?aiPanel():'');$('#screen').innerHTML=c;$('#stage').classList.toggle('special',special);if(special){$('#screen').style.height='100%'}else $('#screen').style.height='';}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.add('hidden'),4200)}function open(s){state.screen=s;state.start=false;state.quick=false;state.ai=false;render()}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.addEventListener('click',e=>{let el=e.target.closest('[data-open],[data-filter],[data-app],[data-action]');if(!el)return;if(el.dataset.open){open(el.dataset.open);return}if(el.dataset.filter){state.catFilter=el.dataset.filter;render();return}if(el.dataset.app){state.selectedApp=el.dataset.app;render();return}let a=el.dataset.action;switch(a){case 'start':state.start=!state.start;state.quick=false;state.ai=false;render();if(state.start)$('#startSearch')?.focus();break;case 'quick':state.quick=!state.quick;state.start=false;state.ai=false;render();break;case 'ai':state.ai=!state.ai;state.start=false;state.quick=false;render();break;case 'wifi':state.wifi=!state.wifi;render();toast('Wi‑Fi '+(state.wifi?'đã bật':'đã tắt')+' · mô phỏng');break;case 'bt':state.bt=!state.bt;render();toast('Bluetooth '+(state.bt?'đã bật':'đã tắt')+' · mô phỏng');break;case 'auto-update':state.autoUpdate=!state.autoUpdate;render();toast('Tự động cập nhật '+(state.autoUpdate?'đã bật':'đã tắt')+' · mô phỏng');break;case 'run-update':state.updateProgress=12;render();let t=setInterval(()=>{state.updateProgress=Math.min(100,state.updateProgress+11);if(state.screen==='update')render();if(state.updateProgress>=100)clearInterval(t)},300);break;case 'ai-send':state.aiText=$('#aiInput')?.value.trim()||'';render();break;case 'ai-printer':state.aiText='Máy in không hoạt động';render();break;case 'ai-files':state.aiText='Tìm file tải xuống';render();break;case 'ai-permission':toast('Bản thật sẽ hiển thị quyền chẩn đoán cụ thể trước khi tiếp tục.');break;case 'install-next':state.installStep=Math.min(2,state.installStep+1);render();break;case 'install-back':state.installStep=Math.max(0,state.installStep-1);render();break;case 'install-finish':open('desktop');toast('Đã mở desktop mẫu; không có cài đặt thực.');break;case 'login':open('desktop');toast('Đăng nhập minh họa; prototype không xác thực mật khẩu.');break;case 'close':state.screen='desktop';state.start=false;$('#screen').innerHTML=desktopBase()+toolbar();break;case 'minimize':toast('Cửa sổ đã thu nhỏ · mô phỏng');break;case 'maximize':$('.app-window')?.classList.toggle('maximized');if($('.app-window')?.classList.contains('maximized')){$('.app-window').style.cssText='left:2%;top:2%;width:96%;height:calc(100% - 84px)'}else $('.app-window').style.cssText='';break;case 'open-settings':open('settings');break;case 'open-printer':open('settings');toast('Chọn “In trang thử” để xem phản hồi.');break;case 'clear-app':state.selectedApp='';render();break;case 'test-print':toast('Đã gửi trang thử · minh họa. Bản thật phải xác nhận CUPS và hàng đợi in.');break;case 'print':toast('Mở hộp thoại in · bản mô phỏng chưa gửi lệnh tới máy in.');break;case 'save':toast('Đã lưu tài liệu mẫu · chỉ là prototype.');break;case 'power':toast('Tắt máy chỉ hoạt động khi tích hợp với hệ điều hành.');break;case 'history':toast('Lịch sử/rollback cần tích hợp với dịch vụ cập nhật thật.');break;case 'access':toast('Trợ năng: thử nút “Tương phản cao” ở thanh trên.');break;case 'trash':toast('Thùng rác đang trống trong bản mẫu.');break;default:toast('Tác vụ “'+a+'” là mô phỏng; cần gắn dịch vụ hệ thống khi triển khai.')}});document.addEventListener('input',e=>{if(e.target.id==='startSearch'){let q=e.target.value.toLocaleLowerCase('vi');document.querySelectorAll('.start-app').forEach(x=>x.hidden=!x.dataset.label.includes(q))}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.ai||state.start||state.quick){state.ai=state.start=state.quick=false;render()}}if(e.key==='Enter'&&e.target.id==='aiInput'){state.aiText=e.target.value.trim();render()}if(e.key==='Enter'&&e.target.id==='startSearch'){let x=document.querySelector('.start-app:not([hidden])');if(x)open(x.dataset.open)}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='e'){e.preventDefault();open('files')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){e.preventDefault();open('desktop')}if(e.altKey&&e.key==='Tab'){toast('Chuyển cửa sổ: bản tương tác minh họa')}});$('#screenSelect').addEventListener('change',e=>open(e.target.value));$('#hc').onclick=()=>$('#stage').classList.toggle('high-contrast');$('#gpu').onclick=()=>$('#stage').classList.toggle('low-gpu');render();
</script></body></html>
