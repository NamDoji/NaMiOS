  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1330" cy="120" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="180" cy="900" r="300" fill="#ffffff" opacity="0.022"/>
  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · Hình nền — Việt Nam qua từng vùng đất — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: Cài đặt › Hình nền ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
    <path d="M17 29 l5 -6 l4 4 l6 -8 l5 10 z" fill="#fff"/><circle cx="26" cy="19" r="2" fill="#fff"/>
    <text x="58" y="28" font-size="13.5" fill="#dfe6f2">Cài đặt — Hình nền · Việt Nam qua từng vùng đất</text>
    <g stroke="#cdd6e6" stroke-width="1.6" fill="none">
      <circle cx="1458" cy="23" r="6"/>
      <rect x="1480" y="17" width="12" height="12" rx="2"/>
    </g>
    <path d="M1502 17 l12 12 M1514 17 l-12 12" stroke="#ff9db4" stroke-width="1.8"/>

    <!-- ===== content ===== -->
    <g transform="translate(40,56)">
      <text x="0" y="16" font-size="18" font-weight="700" fill="#1a2338">Việt Nam qua từng vùng đất</text>
      <text x="0" y="40" font-size="13" fill="#5a6782">Bộ ảnh biên tập — không lấy ngẫu nhiên trên mạng; mỗi ảnh có địa danh xác minh + hồ sơ giấy phép trước khi đóng gói (UX12-025/026/031)</text>

      <!-- ===== Sidebar nhóm ===== -->
      <g transform="translate(0,66)" font-size="13">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#8793ab">NHÓM ẢNH</text>
        <g transform="translate(0,16)">
          <rect x="-10" y="0" width="200" height="34" rx="8" fill="#f4f6fb"/>
          <text x="6" y="22" fill="#5a6782">Tất cả (6 / 18)</text>
        </g>
        <g transform="translate(0,54)">
          <rect x="-10" y="0" width="200" height="34" rx="8" fill="#a21f46" fill-opacity="0.10"/>
          <rect x="-10" y="0" width="3" height="34" rx="1.5" fill="#a21f46"/>
          <text x="6" y="22" font-weight="700" fill="#a21f46">Núi &amp; ruộng bậc thang</text>
        </g>
        <g transform="translate(0,92)"><text x="6" y="22" fill="#5a6782">Thác &amp; rừng</text></g>
        <g transform="translate(0,126)"><text x="6" y="22" fill="#5a6782">Biển &amp; đảo</text></g>
        <g transform="translate(0,160)"><text x="6" y="22" fill="#5a6782">Sông hồ</text></g>
        <g transform="translate(0,194)"><text x="6" y="22" fill="#5a6782">Phố cổ &amp; đô thị</text></g>
        <g transform="translate(0,228)"><text x="6" y="22" fill="#5a6782">Di sản văn hóa</text></g>
        <g transform="translate(0,262)"><text x="6" y="22" fill="#5a6782">Di tích lịch sử</text></g>
        <g transform="translate(0,296)"><text x="6" y="22" fill="#5a6782">Sinh hoạt &amp; nghề truyền thống</text></g>
        <line x1="-10" y1="340" x2="190" y2="340" stroke="#eef0f5"/>
        <g transform="translate(0,352)">
          <text x="-10" y="16" font-size="11" fill="#8793ab">Thêm bộ sưu tập</text>
          <rect x="-10" y="26" width="200" height="34" rx="8" fill="#6f82a6" fill-opacity="0.10"/>
          <text x="6" y="48" fill="#5a6782">Tải thêm (opt-in)…</text>
        </g>
      </g>

