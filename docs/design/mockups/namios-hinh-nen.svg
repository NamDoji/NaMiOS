<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
    <!-- gradient thu nhỏ placeholder cho từng ảnh (duotone ruby/navy, KHÔNG phải ảnh thật) -->
    <linearGradient id="ph1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6a8f"/><stop offset="1" stop-color="#16314f"/></linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8c9e"/><stop offset="1" stop-color="#123b47"/></linearGradient>
    <linearGradient id="ph3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c07a3a"/><stop offset="1" stop-color="#5a3315"/></linearGradient>
    <linearGradient id="ph4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4a8c"/><stop offset="1" stop-color="#1f1a3a"/></linearGradient>
    <linearGradient id="ph5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f8f5a"/><stop offset="1" stop-color="#143a24"/></linearGradient>
    <linearGradient id="ph6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a2456f"/><stop offset="1" stop-color="#3a1727"/></linearGradient>
