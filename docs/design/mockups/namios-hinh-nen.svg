          <rect x="220" y="636" width="200" height="38" rx="19" fill="#a21f46" fill-opacity="0.08" stroke="#a21f46" stroke-opacity="0.3"/>
          <text x="320" y="660" font-size="12" font-weight="700" fill="#a21f46" text-anchor="middle">Xem hồ sơ duyệt</text>
        </g>
