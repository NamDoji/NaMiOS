      <g transform="translate(220,66)">
        <!-- hàng 1 -->
        <g transform="translate(0,0)">
          <rect width="214" height="140" rx="12" fill="url(#ph1)" stroke="#a21f46" stroke-width="3"/>
          <g transform="translate(140,98) scale(0.9)"><path d="M-30 20 l16 -22 l12 10 l18 -26 l24 38 z" fill="#ffffff" fill-opacity="0.22"/></g>
          <rect x="0" y="104" width="214" height="36" rx="0" fill="#000" fill-opacity="0.28"/>
          <text x="10" y="128" font-size="11.5" font-weight="700" fill="#fff">Ruộng bậc thang Mù Cang Chải</text>
          <circle cx="192" cy="18" r="13" fill="#e0a13a" fill-opacity="0.9"/>
          <text x="192" y="22" font-size="13" font-weight="700" fill="#4a2e04" text-anchor="middle">!</text>
          <rect x="8" y="8" width="20" height="20" rx="6" fill="#000" fill-opacity="0.35"/>
          <path d="M14 22 v-9 a4 4 0 0 1 8 0 v9" fill="none" stroke="#fff" stroke-width="1.6"/>
        </g>
        <g transform="translate(234,0)">
