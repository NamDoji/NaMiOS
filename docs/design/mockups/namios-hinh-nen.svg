          <text x="14" y="455" font-size="11.5" font-weight="700" fill="#a21f46">Ảnh này KHÔNG được đóng gói vào ISO</text>
          <text x="14" y="472" font-size="11" fill="#5a6782">cho tới khi có bằng chứng quyền sử dụng (UX12-026).</text>

          <!-- xem trước sáng/tối -->
          <text x="0" y="516" font-size="10.5" font-weight="700" fill="#8793ab">XEM TRƯỚC — CHỮ VẪN ĐỌC ĐƯỢC (UX12-028)</text>
          <g transform="translate(0,526)">
            <rect width="204" height="92" rx="8" fill="#0d1420"/>
            <rect x="0" y="58" width="204" height="34" rx="0" fill="#000" fill-opacity="0.35"/>
            <rect x="14" y="68" width="110" height="16" rx="8" fill="#ffffff" fill-opacity="0.14"/>
            <text x="24" y="80" font-size="9.5" fill="#fff">Tên tệp.docx</text>
            <text x="14" y="18" font-size="10" fill="#cdd9f0">Chế độ tối</text>
          </g>
          <g transform="translate(216,526)">
