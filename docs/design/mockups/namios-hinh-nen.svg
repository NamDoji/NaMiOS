            <text x="0" y="46" font-size="10.5" font-weight="700" fill="#8793ab">TÁC GIẢ</text>
            <text x="0" y="64" fill="#1a2338">Chưa xác định — ảnh placeholder biên tập nội bộ</text>

            <text x="0" y="92" font-size="10.5" font-weight="700" fill="#8793ab">GIẤY PHÉP</text>
            <rect x="0" y="100" width="300" height="26" rx="13" fill="#e0a13a" fill-opacity="0.15" stroke="#b9790f"/>
            <text x="14" y="117" font-size="11.5" font-weight="700" fill="#b9790f">CHƯA CÓ GIẤY PHÉP — CHƯA ĐÓNG GÓI</text>

            <text x="0" y="152" font-size="10.5" font-weight="700" fill="#8793ab">NGUỒN</text>
            <text x="0" y="170" fill="#1a2338">Placeholder nội bộ, chờ hội đồng duyệt trước khi đóng gói</text>

            <text x="0" y="198" font-size="10.5" font-weight="700" fill="#8793ab">GHI CÔNG KHI SỬ DỤNG</text>
            <text x="0" y="216" fill="#5a6782">— (chưa có, vì chưa cấp phép)</text>
          </g>

