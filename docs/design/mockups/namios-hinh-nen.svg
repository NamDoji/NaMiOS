          <g transform="translate(107,80)"><path d="M-70 30 l25 -14 l20 10 l25 -30 l40 34 z" fill="#ffffff" fill-opacity="0.2"/></g>
          <rect x="0" y="104" width="214" height="36" fill="#000" fill-opacity="0.28"/>
          <text x="10" y="128" font-size="11.5" font-weight="700" fill="#fff">Vịnh Hạ Long, Quảng Ninh</text>
          <circle cx="192" cy="18" r="13" fill="#1f8a52" fill-opacity="0.9"/>
          <text x="192" y="23" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓</text>
        </g>
        <g transform="translate(468,0)">
