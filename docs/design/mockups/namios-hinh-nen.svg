            <rect x="0" y="58" width="204" height="34" rx="0" fill="#fff" fill-opacity="0.6"/>
            <rect x="14" y="68" width="110" height="16" rx="8" fill="#ffffff" stroke="#c7cedf"/>
            <text x="24" y="80" font-size="9.5" fill="#1a2338">Tên tệp.docx</text>
            <text x="14" y="18" font-size="10" fill="#5a6782">Chế độ sáng</text>
