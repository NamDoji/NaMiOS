        <text x="0" y="328" font-size="11.5" fill="#8793ab">+ 12 ảnh khác trong đợt tuyển chọn đầu (UX12-025: 12–18 ảnh, hội đồng thiết kế + biên tập + pháp lý tư liệu duyệt)</text>
        <g transform="translate(0,354)" font-size="11">
