          <path d="M20 90 q87 -34 174 0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5"/>
          <rect x="0" y="104" width="214" height="36" fill="#000" fill-opacity="0.28"/>
          <text x="10" y="128" font-size="11.5" font-weight="700" fill="#fff">Cầu Vàng, Đà Nẵng</text>
          <circle cx="192" cy="18" r="13" fill="#e0a13a" fill-opacity="0.9"/>
          <text x="192" y="22" font-size="13" font-weight="700" fill="#4a2e04" text-anchor="middle">!</text>
