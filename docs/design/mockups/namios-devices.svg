          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#6f82a6">Chưa kiểm</text>
        </g>
        <text x="736" y="28" font-size="12" fill="#5a6782">— (chưa có lần kiểm)</text>
        <text x="936" y="28" font-size="12" fill="#5a6782">Cần đường dây điện thoại để thử</text>
      </g>

      <!-- cảnh báo / ghi chú trung thực -->
      <g transform="translate(24,400)">
        <rect x="-24" y="-16" width="1416" height="2" fill="transparent"/>
