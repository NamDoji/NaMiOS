<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1330" cy="120" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="180" cy="900" r="300" fill="#ffffff" opacity="0.022"/>
  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · Thiết bị — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: Thiết bị ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <!-- title bar -->
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
    <rect x="18" y="19" width="10" height="7" rx="1.5" fill="none" stroke="#fff" stroke-width="1.3" transform="translate(0,0)"/>
    <text x="58" y="28" font-size="13.5" fill="#dfe6f2">Thiết bị — Máy in, mạng &amp; phụ kiện</text>
    <g stroke="#cdd6e6" stroke-width="1.6" fill="none">
      <circle cx="1458" cy="23" r="6"/>
      <rect x="1480" y="17" width="12" height="12" rx="2"/>
    </g>
    <path d="M1502 17 l12 12 M1514 17 l-12 12" stroke="#ff9db4" stroke-width="1.8"/>

    <!-- ===== content ===== -->
    <g transform="translate(40,66)">
      <text x="0" y="20" font-size="18" font-weight="700" fill="#1a2338">Thiết bị đã kết nối</text>
      <text x="0" y="42" font-size="13" fill="#5a6782">4 thiết bị · mỗi chức năng được kiểm riêng, không gộp</text>

      <!-- ====== Máy đa chức năng — khối chính, 4 dòng riêng ====== -->
      <rect x="0" y="62" width="1440" height="330" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
      <g transform="translate(24,90)">
        <rect x="0" y="0" width="52" height="44" rx="8" fill="#3a4766"/>
        <rect x="8" y="8" width="36" height="14" rx="2" fill="#cdd9f0"/>
        <rect x="8" y="26" width="36" height="12" rx="2" fill="#24406e"/>
        <circle cx="16" cy="32" r="1.6" fill="#cdd9f0"/>
        <text x="70" y="18" font-size="15.5" font-weight="700" fill="#1a2338">Máy đa chức năng — Canon LBP-X200 (phòng Kế toán)</text>
        <text x="70" y="38" font-size="12" fill="#5a6782">Kết nối: mạng nội bộ · 192.168.1.42 · Chạy kiểu: Máy Việt (driver bản địa)</text>
      </g>

      <line x1="24" y1="152" x2="1416" y2="152" stroke="#e8ebf2"/>

      <!-- header row -->
      <g font-size="11.5" font-weight="700" fill="#5a6782">
        <text x="48" y="174">CHỨC NĂNG</text>
        <text x="420" y="174">TRẠNG THÁI</text>
        <text x="760" y="174">NGÀY KIỂM</text>
        <text x="960" y="174">GHI CHÚ</text>
      </g>

      <!-- Dòng: In — ĐẠT -->
      <g transform="translate(24,190)">
        <rect x="0" y="0" width="1392" height="46" rx="8" fill="#ffffff"/>
        <circle cx="22" cy="23" r="10" fill="#1f8a52" fill-opacity="0.14"/>
        <path d="M16 20 h12 v10 h-12 z M18 16 h8 v4 h-8 z" fill="none" stroke="#1f8a52" stroke-width="1.5"/>
        <text x="44" y="28" font-size="13.5" font-weight="700" fill="#1a2338">In</text>
        <g transform="translate(396,14)">
          <circle cx="6" cy="6" r="5" fill="#1f8a52"/>
          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#1f8a52">Đạt</text>
        </g>
        <text x="736" y="28" font-size="12" fill="#5a6782">05/11/2026</text>
        <text x="936" y="28" font-size="12" fill="#5a6782">In thử 3 trang khổ A4 — nét rõ</text>
      </g>

      <!-- Dòng: Scan — ĐẠT -->
      <g transform="translate(24,242)">
        <rect x="0" y="0" width="1392" height="46" rx="8" fill="#ffffff"/>
        <circle cx="22" cy="23" r="10" fill="#1f8a52" fill-opacity="0.14"/>
        <rect x="15" y="16" width="14" height="14" rx="2" fill="none" stroke="#1f8a52" stroke-width="1.5"/>
        <text x="44" y="28" font-size="13.5" font-weight="700" fill="#1a2338">Scan (quét)</text>
        <g transform="translate(396,14)">
          <circle cx="6" cy="6" r="5" fill="#1f8a52"/>
          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#1f8a52">Đạt</text>
        </g>
        <text x="736" y="28" font-size="12" fill="#5a6782">05/11/2026</text>
        <text x="936" y="28" font-size="12" fill="#5a6782">Quét ra PDF — lưu Tệp của tôi thành công</text>
      </g>

      <!-- Dòng: Copy — CHƯA KIỂM (quan trọng nhất) -->
      <g transform="translate(24,294)">
        <rect x="0" y="0" width="1392" height="46" rx="8" fill="#ffffff" stroke="#6f82a6" stroke-opacity="0.35" stroke-dasharray="4 3"/>
        <circle cx="22" cy="23" r="10" fill="#6f82a6" fill-opacity="0.14"/>
        <rect x="14" y="15" width="12" height="16" rx="1.5" fill="none" stroke="#6f82a6" stroke-width="1.4"/>
        <rect x="19" y="20" width="12" height="16" rx="1.5" fill="#ffffff" stroke="#6f82a6" stroke-width="1.4"/>
        <text x="44" y="28" font-size="13.5" font-weight="700" fill="#1a2338">Copy (sao chụp)</text>
        <g transform="translate(396,14)">
          <rect x="1" y="1" width="10" height="10" fill="#6f82a6"/>
          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#6f82a6">Chưa kiểm</text>
        </g>
        <text x="736" y="28" font-size="12" fill="#5a6782">— (chưa có lần kiểm)</text>
        <text x="936" y="28" font-size="12" fill="#5a6782">Chưa thử — khác cơ chế với in/scan</text>
      </g>

      <!-- Dòng: Fax — CHƯA KIỂM -->
      <g transform="translate(24,346)">
        <rect x="0" y="0" width="1392" height="46" rx="8" fill="#ffffff" stroke="#6f82a6" stroke-opacity="0.35" stroke-dasharray="4 3"/>
        <circle cx="22" cy="23" r="10" fill="#6f82a6" fill-opacity="0.14"/>
        <path d="M14 17 h16 v12 h-16 z M14 17 l8 6 l8 -6" fill="none" stroke="#6f82a6" stroke-width="1.4"/>
