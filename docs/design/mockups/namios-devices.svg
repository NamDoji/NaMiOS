  <text x="36" y="977" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  <text x="56" y="977" font-size="14" font-weight="700" fill="#eef2fa">Bắt đầu</text>

  <rect x="160" y="952" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="184" cy="972" r="7" fill="none" stroke="#9fb0d0" stroke-width="2"/>
  <path d="M189 977 l6 6" stroke="#9fb0d0" stroke-width="2" stroke-linecap="round"/>
  <text x="206" y="977" font-size="13.5" fill="#9fb0d0">Tìm kiếm</text>

