      <!-- note dưới khối -->
      <g transform="translate(24,370)"></g>

      <!-- ====== note PRA-001 ====== -->
      <g transform="translate(0,410)">
        <rect x="0" y="0" width="1440" height="40" rx="8" fill="#e0a13a" fill-opacity="0.1" stroke="#e0a13a" stroke-opacity="0.35"/>
        <path d="M18 20 l6 -11 l6 11 z" fill="#b9790f" transform="translate(4,2)"/>
        <text x="46" y="26" font-size="12.5" fill="#6a4a0f">In được + scan được KHÔNG tự thành copy được — copy là chức năng riêng, phải kiểm riêng.</text>
      </g>

      <!-- ====== Máy in mạng riêng ====== -->
      <g transform="translate(0,472)">
        <rect x="0" y="0" width="704" height="128" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
        <g transform="translate(20,20)">
          <rect x="0" y="0" width="40" height="36" rx="6" fill="#2a4a7a"/>
          <rect x="6" y="6" width="28" height="10" rx="1.5" fill="#cdd9f0"/>
          <text x="56" y="18" font-size="14" font-weight="700" fill="#1a2338">Máy in mạng — phòng Hành chính</text>
          <text x="56" y="36" font-size="11.5" fill="#5a6782">HP LaserJet · mạng nội bộ 192.168.1.50</text>
        </g>
        <g transform="translate(20,74)">
          <circle cx="6" cy="6" r="5" fill="#1f8a52"/>
          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#1f8a52">Đạt</text>
          <text x="90" y="10" font-size="12" fill="#5a6782">In · kiểm 05/11/2026</text>
        </g>
        <text x="20" y="108" font-size="11" fill="#8793ab">Chỉ có chức năng in — không scan/copy/fax</text>
      </g>

      <!-- ====== Wi-Fi + Bluetooth ====== -->
      <g transform="translate(736,472)">
        <rect x="0" y="0" width="704" height="128" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
        <g transform="translate(20,18)">
          <g transform="translate(0,0)" fill="none" stroke="#2a4a7a" stroke-width="2.4" stroke-linecap="round">
            <path d="M0 10 a18 18 0 0 1 26 0"/><path d="M5 16 a11 11 0 0 1 16 0"/><circle cx="13" cy="22" r="2" fill="#2a4a7a" stroke="none"/>
          </g>
          <text x="46" y="18" font-size="14" font-weight="700" fill="#1a2338">Wi-Fi — Văn phòng 5G</text>
          <text x="46" y="36" font-size="11.5" fill="#5a6782">Chuẩn WPA2 · đã lưu mật khẩu</text>
        </g>
        <g transform="translate(20,74)">
          <circle cx="6" cy="6" r="5" fill="#1f8a52"/>
          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#1f8a52">Đạt</text>
          <text x="90" y="10" font-size="12" fill="#5a6782">Đã kết nối ổn định</text>
        </g>

        <line x1="352" y1="14" x2="352" y2="112" stroke="#e8ebf2"/>

        <g transform="translate(376,18)">
          <path d="M6 0 v30 l10 -8 l-10 -8 l10 -7 z" fill="none" stroke="#2a4a7a" stroke-width="2"/>
          <text x="46" y="18" font-size="14" font-weight="700" fill="#1a2338">Tai nghe Bluetooth</text>
          <text x="46" y="36" font-size="11.5" fill="#5a6782">Sony WH — đã ghép nối</text>
        </g>
        <g transform="translate(376,74)">
          <path d="M0 5 l6 -10 l6 10 z" fill="#b9790f"/>
          <text x="16" y="10" font-size="12.5" font-weight="700" fill="#b9790f">Một phần</text>
          <text x="104" y="10" font-size="12" fill="#5a6782">Nghe tốt — mic chưa thử</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== Thanh tác vụ (taskbar) ===== -->
  <rect x="0" y="944" width="1600" height="56" fill="#0c1424" fill-opacity="0.86"/>
  <line x1="0" y1="944" x2="1600" y2="944" stroke="#ffffff" stroke-opacity="0.07"/>

  <rect x="16" y="952" width="128" height="40" rx="10" fill="#ffffff" fill-opacity="0.06"/>
