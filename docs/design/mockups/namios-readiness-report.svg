<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1330" cy="120" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="180" cy="900" r="300" fill="#ffffff" opacity="0.022"/>
  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · Báo cáo sẵn sàng — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: Báo cáo sẵn sàng chuyển đổi ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
    <path d="M23 15 v12 M17 21 l6 6 l6 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="28" font-size="13.5" fill="#dfe6f2">Báo cáo sẵn sàng chuyển đổi — KT-VP-014</text>
    <g stroke="#cdd6e6" stroke-width="1.6" fill="none">
      <circle cx="1458" cy="23" r="6"/>
      <rect x="1480" y="17" width="12" height="12" rx="2"/>
    </g>
    <path d="M1502 17 l12 12 M1514 17 l-12 12" stroke="#ff9db4" stroke-width="1.8"/>

    <!-- ===== content ===== -->
    <g transform="translate(40,58)">
      <!-- Kết luận máy: BỊ CHẶN -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="1440" height="96" rx="12" fill="#fdf1ef" stroke="#c23127" stroke-opacity="0.35"/>
        <g transform="translate(26,24)">
          <path d="M0 -8 l16 16 M16 -8 l-16 16" stroke="#c23127" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="64" y="30" font-size="17" font-weight="700" fill="#c23127">Kết luận máy: BỊ CHẶN — chưa thể chuyển máy chính</text>
        <text x="64" y="54" font-size="13" fill="#5a6782">1 việc thiết yếu (Ký số hóa đơn điện tử) bị chặn → toàn máy "blocked", dù 9/12 việc khác đạt hoặc gần đạt.</text>
        <text x="64" y="76" font-size="12" fill="#8793ab">N10-009: blocker của một công việc bắt buộc luôn chặn máy chính — không tính trung bình phần trăm.</text>
      </g>

      <!-- Chú giải 5 trạng thái -->
      <g transform="translate(0,114)" font-size="12.5" fill="#1a2338">
        <g transform="translate(0,0)"><circle cx="6" cy="-4" r="6" fill="#1f8a52"/><text x="18" y="0">● Sẵn sàng</text></g>
        <g transform="translate(166,0)"><path d="M0 2 l7 -12 l7 12 z" fill="#b9790f"/><text x="22" y="0">▲ Sẵn sàng có giới hạn</text></g>
        <g transform="translate(398,0)"><rect x="-1" y="-10" width="13" height="13" fill="#a21f46" transform="rotate(45 5 -3)"/><text x="22" y="0">◆ Chỉ thử nghiệm (pilot)</text></g>
        <g transform="translate(624,0)"><path d="M0 -8 l12 12 M12 -8 l-12 12" stroke="#c23127" stroke-width="2.4"/><text x="22" y="0">✕ Bị chặn</text></g>
        <g transform="translate(772,0)"><rect x="0" y="-12" width="12" height="12" fill="#6f82a6"/><text x="22" y="0">■ Chưa kiểm</text></g>
      </g>

      <!-- 12 hành trình — bảng -->
      <g transform="translate(0,150)" font-size="11.5" font-weight="700" fill="#5a6782">
        <text x="0" y="0">VIỆC THIẾT YẾU (12 hành trình N10-031)</text>
        <text x="900" y="0">TRẠNG THÁI</text>
        <text x="1060" y="0">GHI CHÚ</text>
      </g>
      <line x1="0" y1="158" x2="1440" y2="158" stroke="#e3e7f0"/>

      <g font-size="13" fill="#1a2338">
        <!-- row template repeated -->
        <g transform="translate(0,176)">
          <text x="0" y="0">1. Soạn DOCX có dấu tiếng Việt</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">LibreOffice Writer — native</text>
        </g>
        <line x1="0" y1="190" x2="1440" y2="190" stroke="#eef0f5"/>

        <g transform="translate(0,208)">
          <text x="0" y="0">2. Bảng XLSX có công thức</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">LibreOffice Calc — native</text>
        </g>
        <line x1="0" y1="222" x2="1440" y2="222" stroke="#eef0f5"/>

        <g transform="translate(0,240)">
          <text x="0" y="0">3. Nhận/gửi Zalo Web</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Dịch vụ web — QR login ổn</text>
        </g>
        <line x1="0" y1="254" x2="1440" y2="254" stroke="#eef0f5"/>

        <g transform="translate(0,272)">
          <text x="0" y="0">4. Học/họp trực tuyến</text>
          <g transform="translate(900,-10)"><path d="M0 2 l7 -12 l7 12 z" fill="#b9790f"/><text x="24" y="10" font-size="12" font-weight="700" fill="#b9790f">Có giới hạn</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Mic ổn — chia sẻ màn hình chưa thử hết trình chiếu</text>
        </g>
        <line x1="0" y1="286" x2="1440" y2="286" stroke="#eef0f5"/>

        <g transform="translate(0,304)">
          <text x="0" y="0">5. In phiếu</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Canon LBP-X200 — driver native</text>
        </g>
        <line x1="0" y1="318" x2="1440" y2="318" stroke="#eef0f5"/>

        <g transform="translate(0,336)">
          <text x="0" y="0">6. Scan ADF nhiều trang</text>
          <g transform="translate(900,-10)"><path d="M0 2 l7 -12 l7 12 z" fill="#b9790f"/><text x="24" y="10" font-size="12" font-weight="700" fill="#b9790f">Có giới hạn</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Quét 1 trang ổn — ADF nhiều trang còn kẹt giấy ảo</text>
        </g>
        <line x1="0" y1="350" x2="1440" y2="350" stroke="#eef0f5"/>

        <g transform="translate(0,368)">
          <text x="0" y="0">7. Tạo hóa đơn điện tử (thử)</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">MISA SME.VN qua Thử-Wine</text>
        </g>
        <line x1="0" y1="382" x2="1440" y2="382" stroke="#eef0f5"/>

        <g transform="translate(0,400)">
          <rect x="-12" y="-16" width="1464" height="34" rx="8" fill="#fdf1ef"/>
          <text x="0" y="0" font-weight="700">8. Ký số hóa đơn điện tử (môi trường test)</text>
          <g transform="translate(900,-10)"><path d="M0 -6 l12 12 M12 -6 l-12 12" stroke="#c23127" stroke-width="2"/><text x="20" y="10" font-size="12" font-weight="700" fill="#c23127">Bị chặn</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#c23127">USB Token chưa có middleware PKCS#11 bản Linux — việc THIẾT YẾU</text>
        </g>
        <line x1="0" y1="414" x2="1440" y2="414" stroke="#eef0f5"/>

        <g transform="translate(0,432)">
          <text x="0" y="0">9. Nộp biểu mẫu test qua cổng</text>
          <g transform="translate(900,-10)"><rect x="-1" y="-4" width="13" height="13" fill="#a21f46" transform="rotate(45 5.5 2.5)"/><text x="24" y="10" font-size="12" font-weight="700" fill="#a21f46">Pilot</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Đạt trên cổng có sandbox; cổng thật chưa thử</text>
        </g>
        <line x1="0" y1="446" x2="1440" y2="446" stroke="#eef0f5"/>

        <g transform="translate(0,464)">
          <text x="0" y="0">10. Sao lưu dữ liệu bán hàng</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Phục hồi thử 10 tệp mẫu thành công</text>
        </g>
        <line x1="0" y1="478" x2="1440" y2="478" stroke="#eef0f5"/>

        <g transform="translate(0,496)">
          <text x="0" y="0">11. Wi-Fi &amp; Bluetooth</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Kết nối ổn định 48 giờ thử</text>
        </g>
        <line x1="0" y1="510" x2="1440" y2="510" stroke="#eef0f5"/>

        <g transform="translate(0,528)">
          <text x="0" y="0">12. Khôi phục sau cập nhật lỗi</text>
          <g transform="translate(900,-10)"><rect x="0" y="-4" width="12" height="12" fill="#6f82a6"/><text x="20" y="10" font-size="12" font-weight="700" fill="#6f82a6">Chưa kiểm</text></g>
          <text x="1060" y="0" font-size="11.5" fill="#5a6782">Chưa diễn tập rollback trên máy này</text>
        </g>
      </g>

      <!-- cột phải nhỏ: nhắc nguyên tắc -->
      <g transform="translate(0,566)">
        <rect x="0" y="0" width="1440" height="56" rx="10" fill="#eaf0fb"/>
        <text x="20" y="24" font-size="12.5" font-weight="700" fill="#1a2338">Không quy đổi thành phần trăm trung bình.</text>
        <text x="20" y="42" font-size="12" fill="#5a6782">9 sẵn sàng + 2 có giới hạn + 1 bị chặn ≠ "92% sẵn sàng" — mục 8 là việc bắt buộc nên kết luận máy vẫn là BỊ CHẶN.</text>
      </g>
    </g>
  </g>

  <!-- ===== Thanh tác vụ (taskbar) ===== -->
  <rect x="0" y="944" width="1600" height="56" fill="#0c1424" fill-opacity="0.86"/>
  <line x1="0" y1="944" x2="1600" y2="944" stroke="#ffffff" stroke-opacity="0.07"/>

  <rect x="16" y="952" width="128" height="40" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="26" y="962" width="20" height="20" rx="6" fill="url(#acc)"/>
  <text x="36" y="977" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  <text x="56" y="977" font-size="14" font-weight="700" fill="#eef2fa">Bắt đầu</text>

  <rect x="160" y="952" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="184" cy="972" r="7" fill="none" stroke="#9fb0d0" stroke-width="2"/>
  <path d="M189 977 l6 6" stroke="#9fb0d0" stroke-width="2" stroke-linecap="round"/>
  <text x="206" y="977" font-size="13.5" fill="#9fb0d0">Tìm kiếm</text>

  <g>
    <g transform="translate(420,954)"><rect width="36" height="36" rx="9" fill="#caa23c"/><path d="M8 11 h9 l3 4 h12 v14 h-24 z" fill="#fff"/></g>
    <g transform="translate(466,954)"><rect width="36" height="36" rx="9" fill="#2a4a7a"/><circle cx="18" cy="18" r="11" fill="none" stroke="#fff" stroke-width="2"/><path d="M7 18 h22 M18 7 a16 11 0 0 1 0 22 a16 11 0 0 1 0 -22" fill="none" stroke="#fff" stroke-width="1.5"/></g>
    <g transform="translate(512,954)"><rect width="36" height="36" rx="9" fill="#2b5fa6"/><text x="18" y="25" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text></g>
    <g transform="translate(558,954)"><rect width="36" height="36" rx="9" fill="#1f8a52"/><text x="18" y="25" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">X</text></g>
    <g transform="translate(604,954)"><rect width="36" height="36" rx="9" fill="#b4122a"/><rect x="9" y="12" width="18" height="13" rx="2" fill="#fff"/><path d="M9 14 l9 6 l9 -6" fill="none" stroke="#b4122a" stroke-width="1.4"/></g>
    <!-- Báo cáo sẵn sàng đang mở (ghi dấu) -->
    <g transform="translate(650,954)">
      <rect width="36" height="36" rx="9" fill="#a21f46"/>
      <path d="M18 9 v10 M12 16 l6 6 l6 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="650" y="994" width="20" height="3" rx="1.5" fill="#e0457a"/>
  </g>

  <g fill="#cdd9f0">
    <rect x="1322" y="958" width="54" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <text x="1349" y="977" font-size="13" fill="#e7edf7" text-anchor="middle">VN</text>
    <g transform="translate(1392,962)" fill="none" stroke="#cdd9f0" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 8 a13 13 0 0 1 18 0"/><path d="M4 12 a8 8 0 0 1 10 0"/><circle cx="9" cy="16" r="1.5" fill="#cdd9f0" stroke="none"/>
    </g>
    <g transform="translate(1428,962)" fill="#cdd9f0"><path d="M0 6 h5 l7 -5 v18 l-7 -5 h-5 z"/><path d="M15 5 a6 6 0 0 1 0 10" fill="none" stroke="#cdd9f0" stroke-width="2"/></g>
    <g transform="translate(1460,964)"><rect x="0" y="0" width="26" height="14" rx="3" fill="none" stroke="#cdd9f0" stroke-width="2"/><rect x="26" y="4" width="3" height="6" fill="#cdd9f0"/><rect x="3" y="3" width="17" height="8" rx="1" fill="#6fd08a"/></g>
    <text x="1584" y="969" font-size="13.5" fill="#eef2fa" text-anchor="end">14:25</text>
    <text x="1584" y="985" font-size="11.5" fill="#aebbd6" text-anchor="end">06/11/2026</text>
  </g>
</svg>
