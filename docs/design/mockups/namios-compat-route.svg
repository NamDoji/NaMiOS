<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1330" cy="120" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="180" cy="900" r="300" fill="#ffffff" opacity="0.022"/>
  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · Chọn tuyến ứng dụng — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: Compatibility Broker ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
    <g stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M18 23 h10"/><path d="M24 18 l4 5 l-4 5"/><path d="M18 18 v2 M18 28 v-2"/>
    </g>
    <text x="58" y="28" font-size="13.5" fill="#dfe6f2">Chọn tuyến ứng dụng — MISA SME.VN</text>
    <g stroke="#cdd6e6" stroke-width="1.6" fill="none">
      <circle cx="1458" cy="23" r="6"/>
      <rect x="1480" y="17" width="12" height="12" rx="2"/>
    </g>
    <path d="M1502 17 l12 12 M1514 17 l-12 12" stroke="#ff9db4" stroke-width="1.8"/>

    <!-- ===== content ===== -->
    <g transform="translate(40,58)">
      <text x="0" y="20" font-size="18" font-weight="700" fill="#1a2338">MISA SME.VN 2024.1 — Kế toán doanh nghiệp</text>
      <text x="0" y="42" font-size="13" fill="#5a6782">Compatibility Broker đề xuất tuyến theo từng THAO TÁC, không một nhãn chung cho cả app</text>

      <!-- 4 route cards -->
      <g transform="translate(0,62)" font-size="12.5">
        <!-- Native -->
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="348" height="150" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
          <rect x="18" y="18" width="40" height="40" rx="10" fill="#1f8a52"/>
          <circle cx="38" cy="38" r="3" fill="#fff"/>
          <text x="70" y="34" font-size="14" font-weight="700" fill="#1a2338">Máy Việt (native)</text>
          <text x="70" y="52" font-size="11.5" fill="#5a6782">Không có bản Linux chính thức</text>
          <g transform="translate(18,78)"><rect x="0" y="-9" width="12" height="12" fill="#6f82a6"/><text x="18" y="1" font-weight="700" fill="#6f82a6">Không khả dụng</text></g>
          <text x="18" y="112" font-size="11" fill="#8793ab">MISA JSC chưa phát hành bản Linux cho sản phẩm này.</text>
        </g>
        <!-- Web -->
        <g transform="translate(372,0)">
          <rect x="0" y="0" width="348" height="150" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
          <rect x="18" y="18" width="40" height="40" rx="10" fill="#2a4a7a"/>
          <circle cx="38" cy="38" r="13" fill="none" stroke="#fff" stroke-width="2"/>
          <path d="M25 38 h26 M38 25 a18 13 0 0 1 0 26 a18 13 0 0 1 0 -26" fill="none" stroke="#fff" stroke-width="1.5"/>
          <text x="70" y="34" font-size="14" font-weight="700" fill="#1a2338">Web (MISA SME Online)</text>
          <text x="70" y="52" font-size="11.5" fill="#5a6782">Gói thuê bao riêng, dữ liệu chưa đồng bộ</text>
          <g transform="translate(18,78)"><rect x="0" y="-9" width="12" height="12" fill="#6f82a6"/><text x="18" y="1" font-weight="700" fill="#6f82a6">Chưa kiểm</text></g>
          <text x="18" y="112" font-size="11" fill="#8793ab">Cần xác nhận hợp đồng vendor trước khi đổi dữ liệu.</text>
        </g>
        <!-- Wine -->
        <g transform="translate(744,0)">
          <rect x="0" y="0" width="348" height="150" rx="12" fill="#f8f9fc" stroke="#a21f46" stroke-opacity="0.35"/>
          <rect x="18" y="18" width="40" height="40" rx="10" fill="#a21f46"/>
          <path d="M28 20 v14 a10 7 0 0 0 20 0 v-14" fill="none" stroke="#fff" stroke-width="2"/>
          <text x="70" y="34" font-size="14" font-weight="700" fill="#1a2338">Thử-Wine (capsule r14)</text>
          <text x="70" y="52" font-size="11.5" fill="#5a6782">Đang dùng — đã kiểm phiên bản 2024.1</text>
          <g transform="translate(18,78)"><path d="M0 3 l6 -11 l6 11 z" fill="#b9790f"/><text x="20" y="1" font-weight="700" fill="#b9790f">Một phần</text></g>
          <text x="18" y="112" font-size="11" fill="#8793ab">Mở GUI + nhập chứng từ đạt; ký số chưa đạt (xem bảng dưới).</text>
        </g>
        <!-- Windows có phép -->
        <g transform="translate(1116,0)">
          <rect x="0" y="0" width="324" height="150" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
          <rect x="18" y="18" width="40" height="40" rx="10" fill="#3a4766"/>
          <rect x="26" y="26" width="24" height="18" rx="2" fill="#cdd9f0"/>
          <path d="M30 50 h16" stroke="#cdd9f0" stroke-width="2"/>
          <text x="70" y="34" font-size="13.5" font-weight="700" fill="#1a2338">Máy Windows có phép</text>
          <text x="70" y="52" font-size="11.5" fill="#5a6782">Máy ảo/remote, có license riêng</text>
          <g transform="translate(18,78)"><circle cx="6" cy="0" r="6" fill="#1f8a52"/><text x="20" y="1" font-weight="700" fill="#1f8a52">Sẵn sàng</text></g>
          <text x="18" y="112" font-size="11" fill="#8793ab">Dùng cho riêng thao tác ký số — có công bố chi phí license.</text>
        </g>
      </g>

      <!-- Lưu ý trung thực -->
      <g transform="translate(0,238)">
        <rect x="0" y="0" width="1440" height="58" rx="10" fill="#a21f46" fill-opacity="0.07" stroke="#a21f46" stroke-opacity="0.25"/>
        <path d="M22 30 l10 -18 l10 18 z" fill="none" stroke="#a21f46" stroke-width="2.2"/>
        <text x="24" y="28" font-size="11.5" font-weight="700" fill="#a21f46">!</text>
        <text x="56" y="24" font-size="13.5" font-weight="700" fill="#a21f46">Lưu ý trung thực: "mở được" KHÔNG đồng nghĩa "ký được"</text>
        <text x="56" y="44" font-size="12" fill="#5a6782">Mỗi thao tác nghiệp vụ có tuyến tốt nhất riêng — không gắn một nhãn trạng thái chung cho toàn bộ ứng dụng.</text>
      </g>

      <!-- bảng thao tác x tuyến -->
      <g transform="translate(0,316)" font-size="11.5" font-weight="700" fill="#5a6782">
        <text x="0" y="0">THAO TÁC NGHIỆP VỤ</text>
        <text x="620" y="0">TUYẾN TỐT NHẤT</text>
        <text x="900" y="0">TRẠNG THÁI</text>
        <text x="1080" y="0">GHI CHÚ</text>
      </g>
      <line x1="0" y1="324" x2="1440" y2="324" stroke="#e3e7f0"/>

      <g font-size="13" fill="#1a2338">
        <g transform="translate(0,350)">
          <text x="0" y="0">Mở giao diện, xem sổ cái</text>
          <text x="620" y="0" font-size="12" fill="#5a6782">Thử-Wine</text>
          <g transform="translate(900,-10)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12" font-weight="700" fill="#1f8a52">Đạt</text></g>
          <text x="1080" y="0" font-size="11.5" fill="#5a6782">Khởi động ổn định, không treo</text>
        </g>
        <line x1="0" y1="364" x2="1440" y2="364" stroke="#eef0f5"/>

        <g transform="translate(0,382)">
          <text x="0" y="0">Nhập chứng từ, in báo cáo</text>
          <text x="620" y="0" font-size="12" fill="#5a6782">Thử-Wine</text>
          <g transform="translate(900,-10)"><path d="M0 2 l6 -11 l6 11 z" fill="#b9790f"/><text x="20" y="10" font-size="12" font-weight="700" fill="#b9790f">Một phần</text></g>
          <text x="1080" y="0" font-size="11.5" fill="#5a6782">In được — lề trang lệch nhẹ so với bản Windows</text>
        </g>
        <line x1="0" y1="396" x2="1440" y2="396" stroke="#eef0f5"/>

        <g transform="translate(0,414)">
          <rect x="-12" y="-16" width="1464" height="34" rx="8" fill="#fdf1ef"/>
          <text x="0" y="0" font-weight="700">Ký số hóa đơn điện tử (test)</text>
          <text x="620" y="0" font-size="12" fill="#5a6782">Máy Windows có phép</text>
          <g transform="translate(900,-10)"><path d="M0 -6 l12 12 M12 -6 l-12 12" stroke="#c23127" stroke-width="2"/><text x="20" y="10" font-size="12" font-weight="700" fill="#c23127">Bị chặn ở Wine</text></g>
          <text x="1080" y="0" font-size="11.5" fill="#c23127">Thiếu middleware PKCS#11 Linux cho token này</text>
        </g>
        <line x1="0" y1="430" x2="1440" y2="430" stroke="#eef0f5"/>

        <g transform="translate(0,448)">
          <text x="0" y="0">Gửi báo cáo qua email nội bộ</text>
          <text x="620" y="0" font-size="12" fill="#5a6782">Thử-Wine</text>
          <g transform="translate(900,-10)"><rect x="0" y="-4" width="12" height="12" fill="#6f82a6"/><text x="20" y="10" font-size="12" font-weight="700" fill="#6f82a6">Chưa kiểm</text></g>
          <text x="1080" y="0" font-size="11.5" fill="#5a6782">Chưa thử — cần hồ sơ SMTP nội bộ</text>
        </g>
      </g>

      <!-- hành động -->
      <g transform="translate(0,512)">
        <rect x="0" y="0" width="260" height="44" rx="12" fill="#a21f46"/>
        <text x="130" y="27" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Dùng Thử-Wine cho mở/nhập</text>
        <rect x="276" y="0" width="300" height="44" rx="12" fill="#6f82a6" fill-opacity="0.12"/>
        <text x="426" y="27" font-size="13" font-weight="700" fill="#5a6782" text-anchor="middle">Xem chi phí Windows có phép (ký số)</text>
      </g>
    </g>
  </g>

  <!-- ===== Thanh tác vụ (taskbar) ===== -->
  <rect x="0" y="944" width="1600" height="56" fill="#0c1424" fill-opacity="0.86"/>
  <line x1="0" y1="944" x2="1600" y2="944" stroke="#ffffff" stroke-opacity="0.07"/>

  <rect x="16" y="952" width="128" height="40" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="26" y="962" width="20" height="20" rx="6" fill="url(#acc)"/>
  <text x="36" y="977" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  <text x="56" y="977" font-size="14" font-weight="700" fill="#eef2fa">Bắt đầu</text>

  <rect x="160" y="952" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="184" cy="972" r="7" fill="none" stroke="#9fb0d0" stroke-width="2"/>
  <path d="M189 977 l6 6" stroke="#9fb0d0" stroke-width="2" stroke-linecap="round"/>
  <text x="206" y="977" font-size="13.5" fill="#9fb0d0">Tìm kiếm</text>

  <g>
    <g transform="translate(420,954)"><rect width="36" height="36" rx="9" fill="#caa23c"/><path d="M8 11 h9 l3 4 h12 v14 h-24 z" fill="#fff"/></g>
    <g transform="translate(466,954)"><rect width="36" height="36" rx="9" fill="#2a4a7a"/><circle cx="18" cy="18" r="11" fill="none" stroke="#fff" stroke-width="2"/><path d="M7 18 h22 M18 7 a16 11 0 0 1 0 22 a16 11 0 0 1 0 -22" fill="none" stroke="#fff" stroke-width="1.5"/></g>
    <g transform="translate(512,954)"><rect width="36" height="36" rx="9" fill="#2b5fa6"/><text x="18" y="25" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text></g>
    <g transform="translate(558,954)"><rect width="36" height="36" rx="9" fill="#1f8a52"/><text x="18" y="25" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">X</text></g>
    <g transform="translate(604,954)"><rect width="36" height="36" rx="9" fill="#b4122a"/><rect x="9" y="12" width="18" height="13" rx="2" fill="#fff"/><path d="M9 14 l9 6 l9 -6" fill="none" stroke="#b4122a" stroke-width="1.4"/></g>
    <!-- Chọn tuyến đang mở (ghi dấu) -->
    <g transform="translate(650,954)">
      <rect width="36" height="36" rx="9" fill="#a21f46"/>
      <g stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M9 18 h12"/><path d="M19 12 l6 6 l-6 6"/>
      </g>
    </g>
    <rect x="650" y="994" width="20" height="3" rx="1.5" fill="#e0457a"/>
  </g>

  <g fill="#cdd9f0">
    <rect x="1322" y="958" width="54" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <text x="1349" y="977" font-size="13" fill="#e7edf7" text-anchor="middle">VN</text>
    <g transform="translate(1392,962)" fill="none" stroke="#cdd9f0" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 8 a13 13 0 0 1 18 0"/><path d="M4 12 a8 8 0 0 1 10 0"/><circle cx="9" cy="16" r="1.5" fill="#cdd9f0" stroke="none"/>
    </g>
    <g transform="translate(1428,962)" fill="#cdd9f0"><path d="M0 6 h5 l7 -5 v18 l-7 -5 h-5 z"/><path d="M15 5 a6 6 0 0 1 0 10" fill="none" stroke="#cdd9f0" stroke-width="2"/></g>
    <g transform="translate(1460,964)"><rect x="0" y="0" width="26" height="14" rx="3" fill="none" stroke="#cdd9f0" stroke-width="2"/><rect x="26" y="4" width="3" height="6" fill="#cdd9f0"/><rect x="3" y="3" width="17" height="8" rx="1" fill="#6fd08a"/></g>
    <text x="1584" y="969" font-size="13.5" fill="#eef2fa" text-anchor="end">14:25</text>
    <text x="1584" y="985" font-size="11.5" fill="#aebbd6" text-anchor="end">06/11/2026</text>
  </g>
</svg>
