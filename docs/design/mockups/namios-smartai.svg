<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1330" cy="120" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="180" cy="900" r="300" fill="#ffffff" opacity="0.022"/>
  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · SmartAI — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: SmartAI — Bảng tác vụ ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <!-- title bar -->
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
    <path d="M23 15 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#fff" transform="translate(0,0) scale(0.55) translate(16,13)"/>
    <text x="58" y="28" font-size="13.5" fill="#dfe6f2">SmartAI — Bảng tác vụ</text>
    <g stroke="#cdd6e6" stroke-width="1.6" fill="none">
      <circle cx="1458" cy="23" r="6"/>
      <rect x="1480" y="17" width="12" height="12" rx="2"/>
    </g>
    <path d="M1502 17 l12 12 M1514 17 l-12 12" stroke="#ff9db4" stroke-width="1.8"/>

    <!-- ===== content ===== -->
    <g transform="translate(40,60)">
      <!-- top: "Tôi muốn làm gì?" -->
      <rect x="0" y="0" width="1440" height="96" rx="12" fill="#f4f6fb"/>
      <text x="24" y="30" font-size="13" font-weight="700" fill="#5a6782">TÔI MUỐN LÀM GÌ?</text>
      <rect x="24" y="42" width="820" height="40" rx="20" fill="#ffffff" stroke="#dfe4ee"/>
      <path d="M24 10 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#a21f46" transform="translate(36,42)"/>
      <text x="80" y="68" font-size="14.5" fill="#1a2338">In bảng điểm lớp 5A</text>
      <rect x="880" y="42" width="128" height="40" rx="20" fill="#a21f46"/>
      <text x="944" y="67" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Thực hiện</text>

      <!-- ===== Cột trái: tiến độ dạng thang (ladder) ===== -->
      <g transform="translate(0,124)">
        <text x="0" y="20" font-size="16" font-weight="700" fill="#1a2338">Tiến độ</text>
        <text x="0" y="42" font-size="12.5" fill="#5a6782">Chưa xong khi chưa tới bước cuối — nhấn nút chỉ là một bước</text>

        <!-- connector line -->
        <line x1="20" y1="80" x2="20" y2="330" stroke="#dfe4ee" stroke-width="2"/>

        <!-- step 1: done -->
        <g transform="translate(0,64)">
          <circle cx="20" cy="20" r="14" fill="#1f8a52"/>
          <path d="M13 20 l5 5 l10 -11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="48" y="16" font-size="14" font-weight="700" fill="#1a2338">✓ Đã gửi hàng đợi in</text>
          <text x="48" y="36" font-size="12" fill="#5a6782">14:21 · tệp đã nằm trong hàng đợi máy in phòng Kế toán</text>
        </g>

        <!-- step 2: current -->
        <g transform="translate(0,140)">
          <circle cx="20" cy="20" r="14" fill="#a21f46"/>
          <circle cx="20" cy="20" r="6" fill="#fff"/>
          <text x="48" y="16" font-size="14" font-weight="700" fill="#a21f46">● Máy báo in xong</text>
          <text x="48" y="36" font-size="12" fill="#5a6782">14:22 · máy in xác nhận đã in xong 3 trang</text>
          <rect x="48" y="46" width="300" height="22" rx="11" fill="#e0a13a" fill-opacity="0.14"/>
          <text x="60" y="61" font-size="11" font-weight="700" fill="#b9790f">▲ Đang chờ bạn xác nhận</text>
        </g>

        <!-- step 3: not yet (greyed) -->
        <g transform="translate(0,236)" opacity="0.55">
          <circle cx="20" cy="20" r="14" fill="none" stroke="#9fb0d0" stroke-width="2"/>
          <text x="48" y="16" font-size="14" font-weight="700" fill="#5a6782">○ Bạn xác nhận đã nhận bản in</text>
          <text x="48" y="36" font-size="12" fill="#8793ab">Chưa thực hiện — tác vụ CHƯA được tính là xong</text>
        </g>

        <!-- nhấn mạnh PRA-032 -->
        <g transform="translate(0,316)">
          <rect x="0" y="0" width="690" height="52" rx="10" fill="#a21f46" fill-opacity="0.07" stroke="#a21f46" stroke-opacity="0.25"/>
          <text x="16" y="21" font-size="12.5" font-weight="700" fill="#a21f46">Lưu ý trung thực</text>
          <text x="16" y="39" font-size="12" fill="#5a6782">Nhấn "Thực hiện" không nghĩa là xong — chỉ xong khi BẠN xác nhận đã nhận bản in.</text>
        </g>

        <!-- bước bị chặn — ví dụ -->
        <text x="0" y="404" font-size="15" font-weight="700" fill="#1a2338">Một bước khác đang bị chặn</text>
        <g transform="translate(0,420)">
          <rect x="0" y="0" width="690" height="70" rx="10" fill="#fdf1ef" stroke="#c23127" stroke-opacity="0.25"/>
          <path d="M18 24 l10 -18 l10 18 z" fill="none" stroke="#c23127" stroke-width="2"/>
          <text x="20" y="22" font-size="11" font-weight="700" fill="#c23127">!</text>
          <text x="48" y="24" font-size="13.5" font-weight="700" fill="#1a2338">Gửi bảng điểm qua email — Bị chặn</text>
          <text x="48" y="44" font-size="12" fill="#5a6782">Chưa có quyền đọc danh bạ phụ huynh lớp 5A.</text>
          <rect x="48" y="52" width="280" height="2" fill="transparent"/>
          <text x="48" y="60" font-size="11.5" font-weight="700" fill="#a21f46">▸ Việc cần làm: Vào Cài đặt → Cấp quyền "Danh bạ"</text>
        </g>
      </g>

      <!-- ===== Cột phải: Quyền đã cấp + Nguồn kết quả + chi tiết kỹ thuật ===== -->
      <g transform="translate(760,124)">
        <text x="0" y="20" font-size="16" font-weight="700" fill="#1a2338">Quyền đã cấp</text>
        <g transform="translate(0,36)">
          <rect x="0" y="0" width="680" height="84" rx="10" fill="#f8f9fc" stroke="#e3e7f0"/>
          <circle cx="24" cy="26" r="10" fill="#1f8a52" fill-opacity="0.14"/>
          <rect x="18" y="20" width="12" height="9" rx="2" fill="none" stroke="#1f8a52" stroke-width="1.5"/>
          <path d="M20 20 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#1f8a52" stroke-width="1.4"/>
          <text x="48" y="22" font-size="13.5" font-weight="700" fill="#1a2338">Đọc hàng đợi máy in</text>
          <text x="48" y="42" font-size="12" fill="#5a6782">Hết hạn sau 10 phút · cấp lúc 14:21</text>
          <rect x="48" y="52" width="88" height="24" rx="12" fill="#a21f46" fill-opacity="0.1" stroke="#a21f46" stroke-opacity="0.3"/>
          <text x="92" y="68" font-size="11.5" font-weight="700" fill="#a21f46" text-anchor="middle">Hoàn tác</text>
          <rect x="146" y="52" width="130" height="24" rx="12" fill="#6f82a6" fill-opacity="0.12"/>
          <text x="211" y="68" font-size="11" fill="#5a6782" text-anchor="middle">Chỉ dùng cho tác vụ này</text>
        </g>

        <text x="0" y="148" font-size="16" font-weight="700" fill="#1a2338">Nguồn kết quả</text>
        <g transform="translate(0,164)">
          <rect x="0" y="0" width="680" height="56" rx="10" fill="#f8f9fc" stroke="#e3e7f0"/>
          <path d="M18 14 h10 l4 5 h14 v15 h-28 z" fill="#caa23c" transform="translate(0,6)"/>
          <text x="54" y="26" font-size="13" fill="#1a2338">Sổ điểm — Lớp 5A — HK1 2026-2027.xlsx</text>
          <text x="54" y="44" font-size="11.5" fill="#5a6782">Tệp của tôi · sửa lần cuối 05/11/2026 bởi cô Lan</text>
        </g>

        <text x="0" y="246" font-size="13" font-weight="700" fill="#a21f46">Chi tiết cho kỹ thuật viên ▸</text>
        <g transform="translate(0,262)">
          <rect x="0" y="0" width="680" height="118" rx="10" fill="#1a2238" opacity="0.95"/>
          <text x="16" y="24" font-size="11" fill="#9fb0d0" font-family="monospace">job_id: pq-88213 · backend: cups</text>
          <text x="16" y="44" font-size="11" fill="#9fb0d0" font-family="monospace">printer: lan://192.168.1.42 (native driver)</text>
          <text x="16" y="64" font-size="11" fill="#9fb0d0" font-family="monospace">scope: print-queue:read · ttl: 600s</text>
          <text x="16" y="84" font-size="11" fill="#9fb0d0" font-family="monospace">state: job-completed (device) · user_ack: pending</text>
          <text x="16" y="104" font-size="11" fill="#9fb0d0" font-family="monospace">contacts:read: DENIED (scope not granted)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== Thanh tác vụ (taskbar) ===== -->
  <rect x="0" y="944" width="1600" height="56" fill="#0c1424" fill-opacity="0.86"/>
  <line x1="0" y1="944" x2="1600" y2="944" stroke="#ffffff" stroke-opacity="0.07"/>

  <rect x="16" y="952" width="128" height="40" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="26" y="962" width="20" height="20" rx="6" fill="url(#acc)"/>
  <text x="36" y="977" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  <text x="56" y="977" font-size="14" font-weight="700" fill="#eef2fa">Bắt đầu</text>

  <rect x="160" y="952" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="184" cy="972" r="7" fill="none" stroke="#9fb0d0" stroke-width="2"/>
  <path d="M189 977 l6 6" stroke="#9fb0d0" stroke-width="2" stroke-linecap="round"/>
  <text x="206" y="977" font-size="13.5" fill="#9fb0d0">Tìm kiếm</text>

  <g>
    <g transform="translate(420,954)"><rect width="36" height="36" rx="9" fill="#caa23c"/><path d="M8 11 h9 l3 4 h12 v14 h-24 z" fill="#fff"/></g>
    <g transform="translate(466,954)"><rect width="36" height="36" rx="9" fill="#2a4a7a"/><circle cx="18" cy="18" r="11" fill="none" stroke="#fff" stroke-width="2"/><path d="M7 18 h22 M18 7 a16 11 0 0 1 0 22 a16 11 0 0 1 0 -22" fill="none" stroke="#fff" stroke-width="1.5"/></g>
    <g transform="translate(512,954)"><rect width="36" height="36" rx="9" fill="#2b5fa6"/><text x="18" y="25" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text></g>
    <g transform="translate(558,954)"><rect width="36" height="36" rx="9" fill="#1f8a52"/><text x="18" y="25" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">X</text></g>
    <g transform="translate(604,954)"><rect width="36" height="36" rx="9" fill="#b4122a"/><rect x="9" y="12" width="18" height="13" rx="2" fill="#fff"/><path d="M9 14 l9 6 l9 -6" fill="none" stroke="#b4122a" stroke-width="1.4"/></g>
    <!-- SmartAI đang mở (ghi dấu) -->
    <g transform="translate(650,954)"><rect width="36" height="36" rx="9" fill="#a21f46"/><path d="M18 8 l3.4 8 l8 3.4 l-8 3.4 l-3.4 8 l-3.4 -8 l-8 -3.4 l8 -3.4 z" fill="#fff"/></g>
    <rect x="650" y="994" width="20" height="3" rx="1.5" fill="#e0457a"/>
  </g>

  <g fill="#cdd9f0">
    <rect x="1322" y="958" width="54" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <text x="1349" y="977" font-size="13" fill="#e7edf7" text-anchor="middle">VN</text>
    <g transform="translate(1392,962)" fill="none" stroke="#cdd9f0" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 8 a13 13 0 0 1 18 0"/><path d="M4 12 a8 8 0 0 1 10 0"/><circle cx="9" cy="16" r="1.5" fill="#cdd9f0" stroke="none"/>
    </g>
    <g transform="translate(1428,962)" fill="#cdd9f0"><path d="M0 6 h5 l7 -5 v18 l-7 -5 h-5 z"/><path d="M15 5 a6 6 0 0 1 0 10" fill="none" stroke="#cdd9f0" stroke-width="2"/></g>
    <g transform="translate(1460,964)"><rect x="0" y="0" width="26" height="14" rx="3" fill="none" stroke="#cdd9f0" stroke-width="2"/><rect x="26" y="4" width="3" height="6" fill="#cdd9f0"/><rect x="3" y="3" width="17" height="8" rx="1" fill="#6fd08a"/></g>
    <text x="1584" y="969" font-size="13.5" fill="#eef2fa" text-anchor="end">14:25</text>
    <text x="1584" y="985" font-size="11.5" fill="#aebbd6" text-anchor="end">06/11/2026</text>
  </g>
</svg>
