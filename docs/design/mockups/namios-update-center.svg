      <text x="0" y="40" font-size="13" fill="#5a6782">Phần cài trên máy có phiên bản thật — dịch vụ web KHÔNG có phiên bản cài trên máy, chỉ theo dõi bằng kiểm tra tự động</text>

      <!-- header row -->
