  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · NaMi Update Center — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: NaMi Update Center ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
