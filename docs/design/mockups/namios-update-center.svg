        <text x="18" y="20" font-size="12.5" font-weight="700" fill="#a21f46">NaMiOS không thể cố định hay rollback phiên bản máy chủ của Zalo/Facebook/YouTube.</text>
        <text x="18" y="38" font-size="11.5" fill="#5a6782">Khi dịch vụ web đổi giao diện hoặc lỗi, hệ thống ghi "sự cố dịch vụ hoặc tương thích" — không gọi là "NaMiOS chưa cập nhật".</text>
