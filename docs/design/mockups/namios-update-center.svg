        <text x="560" y="4" font-size="12.5" fill="#1a2338">Mới nhất</text>
        <g transform="translate(980,-8)"><circle cx="8" cy="8" r="7" fill="#1f8a52"/><text x="22" y="12" font-size="11.5" font-weight="700" fill="#1f8a52">Đạt</text></g>
