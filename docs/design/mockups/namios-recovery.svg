    <g transform="translate(1460,964)"><rect x="0" y="0" width="26" height="14" rx="3" fill="none" stroke="#cdd9f0" stroke-width="2"/><rect x="26" y="4" width="3" height="6" fill="#cdd9f0"/><rect x="3" y="3" width="17" height="8" rx="1" fill="#e0a13a"/></g>
    <text x="1584" y="969" font-size="13.5" fill="#eef2fa" text-anchor="end">14:09</text>
