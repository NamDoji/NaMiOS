<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0457a"/>
      <stop offset="1" stop-color="#a21f46"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#cf3a5e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cf3a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2f9bb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1330" cy="120" r="240" fill="#ffffff" opacity="0.03"/>
  <circle cx="180" cy="900" r="300" fill="#ffffff" opacity="0.022"/>
  <text x="1576" y="34" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">NaMiOS alpha · Cứu hộ &amp; khôi phục — BẢN THIẾT KẾ GIAO DIỆN (mockup)</text>

  <!-- ===== Cửa sổ ứng dụng: NaMi Recovery ===== -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="1520" height="880" rx="12" fill="#ffffff"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h1496 a12 12 0 0 1 12 12 v34 h-1520 z" fill="#263450"/>
    <rect x="14" y="14" width="18" height="18" rx="5" fill="url(#acc)"/>
    <path d="M23 15 a9 9 0 1 0 0.01 0" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M23 15 v4 M23 24 v4 M14 24 h4 M28 24 h4" stroke="#fff" stroke-width="1.5"/>
    <text x="58" y="28" font-size="13.5" fill="#dfe6f2">NaMi Recovery — Cứu hộ &amp; khôi phục sau cập nhật lỗi</text>
    <g stroke="#cdd6e6" stroke-width="1.6" fill="none">
      <circle cx="1458" cy="23" r="6"/>
      <rect x="1480" y="17" width="12" height="12" rx="2"/>
    </g>
    <path d="M1502 17 l12 12 M1514 17 l-12 12" stroke="#ff9db4" stroke-width="1.8"/>

    <!-- ===== content ===== -->
    <g transform="translate(40,60)">
      <!-- Banner kết quả: rollback thành công -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="1440" height="96" rx="12" fill="#eef9f2" stroke="#1f8a52" stroke-opacity="0.35"/>
        <circle cx="42" cy="48" r="18" fill="#1f8a52"/>
        <path d="M34 48 l6 6 l12 -13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="76" y="40" font-size="17" font-weight="700" fill="#1f8a52">Bản cập nhật 06/11/2026 không qua kiểm tra sau khởi động — ĐÃ TỰ ĐỘNG QUAY VỀ bản trước</text>
        <text x="76" y="64" font-size="13" fill="#5a6782">Tệp cá nhân không đổi. Ứng dụng đang chạy bản 05/11/2026 08:00 (bản ổn định liền trước).</text>
        <text x="76" y="84" font-size="12" fill="#8793ab">Mã sự kiện: UPD-4471 · Không cần SmartAI hay mạng để thực hiện bước cứu hộ này (N10-051).</text>
      </g>

      <!-- Dòng thời gian cập nhật -->
      <g transform="translate(0,120)">
        <text x="0" y="16" font-size="15" font-weight="700" fill="#1a2338">Giao dịch cập nhật — từng bước có thể dừng an toàn</text>
        <line x1="20" y1="60" x2="1420" y2="60" stroke="#dfe4ee" stroke-width="2"/>

        <!-- step 1 -->
        <g transform="translate(0,40)">
          <circle cx="20" cy="20" r="13" fill="#1f8a52"/>
          <path d="M14 20 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <text x="20" y="54" font-size="12" fill="#1a2338" text-anchor="middle">Chụp snapshot</text>
          <text x="20" y="70" font-size="10.5" fill="#8793ab" text-anchor="middle">13:58</text>
        </g>
        <!-- step 2 -->
        <g transform="translate(300,40)">
          <circle cx="20" cy="20" r="13" fill="#1f8a52"/>
          <path d="M14 20 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <text x="20" y="54" font-size="12" fill="#1a2338" text-anchor="middle">Tải &amp; kiểm chữ ký</text>
          <text x="20" y="70" font-size="10.5" fill="#8793ab" text-anchor="middle">14:02</text>
        </g>
        <!-- step 3 -->
        <g transform="translate(600,40)">
          <circle cx="20" cy="20" r="13" fill="#1f8a52"/>
          <path d="M14 20 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <text x="20" y="54" font-size="12" fill="#1a2338" text-anchor="middle">Cài đặt &amp; khởi động lại</text>
          <text x="20" y="70" font-size="10.5" fill="#8793ab" text-anchor="middle">14:06</text>
        </g>
        <!-- step 4: fail -->
        <g transform="translate(900,40)">
          <circle cx="20" cy="20" r="13" fill="#c23127"/>
          <path d="M14 14 l12 12 M26 14 l-12 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <text x="20" y="54" font-size="12" font-weight="700" fill="#c23127" text-anchor="middle">Kiểm tra sức khỏe: THẤT BẠI</text>
          <text x="20" y="70" font-size="10.5" fill="#8793ab" text-anchor="middle">14:08 · driver mạng không lên</text>
        </g>
        <!-- step 5: rollback ok -->
        <g transform="translate(1200,40)">
          <circle cx="20" cy="20" r="15" fill="#1f8a52"/>
          <path d="M12 20 l5 5 l11 -12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="20" y="58" font-size="12" font-weight="700" fill="#1f8a52" text-anchor="middle">Tự quay về bản trước: ĐẠT</text>
          <text x="20" y="74" font-size="10.5" fill="#8793ab" text-anchor="middle">14:09</text>
        </g>
      </g>

      <!-- An toàn dữ liệu + hành động -->
      <g transform="translate(0,268)">
        <g>
          <rect x="0" y="0" width="700" height="176" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
          <text x="20" y="28" font-size="14" font-weight="700" fill="#1a2338">An toàn dữ liệu</text>
          <g transform="translate(20,42)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12.5" fill="#1a2338">Tệp cá nhân (Tệp của tôi): <tspan font-weight="700" fill="#1f8a52">không đổi</tspan> — phân vùng dữ liệu tách riêng OS</text></g>
          <g transform="translate(20,70)"><circle cx="6" cy="6" r="6" fill="#1f8a52"/><text x="20" y="10" font-size="12.5" fill="#1a2338">Ứng dụng: quay về phiên bản <tspan font-weight="700">05/11/2026 08:00</tspan></text></g>
          <g transform="translate(20,98)"><path d="M0 5 l6 -10 l6 10 z" fill="#b9790f"/><text x="20" y="10" font-size="12.5" fill="#1a2338">Driver mạng: đã gỡ bản mới, <tspan font-weight="700" fill="#b9790f">cần theo dõi thêm</tspan></text></g>
          <text x="20" y="138" font-size="11.5" fill="#5a6782">Mất điện/mất mạng/hết ổ ở 3 điểm ngắt trong lần thử trước đều có đường khôi phục.</text>
          <text x="20" y="158" font-size="11" fill="#8793ab">Theo N10-016/N10-051 — kiểm toán độc lập đã diễn tập.</text>
        </g>

        <g transform="translate(724,0)">
          <rect x="0" y="0" width="716" height="176" rx="12" fill="#f8f9fc" stroke="#e3e7f0"/>
          <text x="20" y="28" font-size="14" font-weight="700" fill="#1a2338">Lựa chọn tiếp theo</text>
          <g transform="translate(20,42)">
            <rect x="0" y="0" width="330" height="44" rx="12" fill="#a21f46"/>
            <text x="165" y="27" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Khởi động vào USB cứu hộ</text>
          </g>
          <g transform="translate(366,42)">
            <rect x="0" y="0" width="330" height="44" rx="12" fill="#6f82a6" fill-opacity="0.12"/>
            <text x="165" y="27" font-size="12.5" font-weight="700" fill="#5a6782" text-anchor="middle">Thử cập nhật lại sau</text>
          </g>
          <g transform="translate(20,100)">
            <rect x="0" y="0" width="330" height="44" rx="12" fill="#6f82a6" fill-opacity="0.12"/>
            <text x="165" y="27" font-size="12.5" font-weight="700" fill="#5a6782" text-anchor="middle">Xem nhật ký lỗi (UPD-4471)</text>
          </g>
          <g transform="translate(366,100)">
            <rect x="0" y="0" width="330" height="44" rx="12" fill="#6f82a6" fill-opacity="0.12"/>
            <text x="165" y="27" font-size="12.5" font-weight="700" fill="#5a6782" text-anchor="middle">Liên hệ hỗ trợ kỹ thuật</text>
          </g>
        </g>
      </g>

      <!-- Chi tiết kỹ thuật -->
      <g transform="translate(0,464)">
        <text x="0" y="16" font-size="13" font-weight="700" fill="#a21f46">Chi tiết cho kỹ thuật viên ▸</text>
        <rect x="0" y="28" width="1440" height="108" rx="10" fill="#1a2238" opacity="0.95"/>
        <text x="16" y="50" font-size="11" fill="#9fb0d0" font-family="monospace">event: UPD-4471 · ring: pilot · package: kernel-driver-net 6.9.2-3</text>
        <text x="16" y="70" font-size="11" fill="#9fb0d0" font-family="monospace">health_check: net_iface_up=false (retry 3/3) → action: rollback</text>
        <text x="16" y="90" font-size="11" fill="#9fb0d0" font-family="monospace">snapshot_before: ok · snapshot_restore: ok · data_partition: untouched</text>
        <text x="16" y="110" font-size="11" fill="#9fb0d0" font-family="monospace">next_retry_window: sau khi vendor xác nhận bản vá driver</text>
      </g>
    </g>
  </g>

