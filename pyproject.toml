[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namios"
version = "0.0.0.dev0"
description = "NaMiOS — lõi phần mềm Python thuần (M1): envelope, exit code, error code, state machine, compat, paths, Protocol dùng chung."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Đỗ Chí Cường" },
    { name = "Đỗ Bảo Nam" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = []

[project.scripts]
# WIRING tích hợp (owns namios_cli/): console-script thật, deps=None ⇒
# namios_cli.deps.default_dependencies() (implementation thật end-to-end).
namios = "namios_cli.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` cho import package namios_*; `.` (repo root) để các test import fixture
# dùng chung qua đường package `tests.*` (vd `from tests.unit.planner._fixtures
# import ...`) chạy được với MỌI cách gọi — cả `pytest` trần (CI) lẫn
# `python -m pytest`. Thiếu `.` thì `pytest` trần báo "No module named 'tests'".
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: assert là cách chuẩn trong pytest, không phải nguy cơ an ninh.
# UP042: M1-INTERFACES.md quy định tường minh `(str, Enum)` cho ErrorCode/
#   TxState/CompatStatus/AppMode (hợp đồng dùng chung cho 9 WP khác) — GIỮ
#   nguyên chữ ký này, không đổi sang `enum.StrEnum`.
ignore = ["S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test (gồm cả tests/qa/** lồng sâu): một số rule nhắm CODE SẢN XUẤT là
# false-positive hoặc không phù hợp trong test — relax RIÊNG cho test, `src/`
# vẫn full strict. S101/S105/S106 (assert/"password" trong fixture), S108
# (đường /tmp cố định trong test injection để chứng minh marker KHÔNG bị tạo),
# S110 (try/except/pass nuốt lỗi dự kiến trong test đối kháng), S311 (random để
# fuzz), E402 (bootstrap `sys.path` trước import trong vài test QA), B023 (closure
# bắt biến vòng lặp trong test đồng thời — cố ý, suite đang xanh).
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S311", "E402", "B023"]
# namios_compat là module DỮ LIỆU tương thích/bảo mật: enum/mã lỗi/i18n key
# chứa đúng từ vựng "pass"/"token"/"secret"/"credential" làm tên/giá trị hằng
# — S105 ("hardcoded password") ở đây toàn false-positive. Chỉ miễn cho 3 file
# dữ liệu thuần; các file LOGIC (resolver/schema/evidence/classifier/…) giữ S105.
"src/namios_compat/_types.py" = ["S105"]
"src/namios_compat/_errors.py" = ["S105"]
"src/namios_compat/_i18n.py" = ["S105"]
# namios_smartai: enum/mã lỗi/i18n có "token"/"secret"/"password" làm tên/giá
# trị hằng (bảo mật/consent) — S105 false-positive. Chỉ miễn file dữ liệu thuần.
"src/namios_smartai/_types.py" = ["S105"]
"src/namios_smartai/_errors.py" = ["S105"]
"src/namios_smartai/_i18n.py" = ["S105"]
# namios_pra: enum/mã lỗi/i18n có "password" (NetworkFault.WRONG_PASSWORD) +
# "token" làm tên hằng — S105 false-positive. Chỉ miễn file dữ liệu thuần.
"src/namios_pra/_types.py" = ["S105"]
"src/namios_pra/_errors.py" = ["S105"]
"src/namios_pra/_i18n.py" = ["S105"]
# namios_e08: enum có "token" (DeviceFunction.TOKEN, DepKind.PRINTER_TOKEN) làm tên
# hằng — S105 false-positive. Chỉ miễn file dữ liệu thuần.
"src/namios_e08/_types.py" = ["S105"]
"src/namios_e08/_errors.py" = ["S105"]
"src/namios_e08/_i18n.py" = ["S105"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "namios_core.*"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
