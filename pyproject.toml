[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namios"
version = "0.0.0.dev0"
description = "NaMiOS — lõi phần mềm Python thuần (M1): envelope, exit code, error code, state machine, compat, paths, Protocol dùng chung."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Đỗ Chí Cường" },
    { name = "Đỗ Bảo Nam" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = []

[project.scripts]
# WIRING tích hợp (owns namios_cli/): console-script thật, deps=None ⇒
# namios_cli.deps.default_dependencies() (implementation thật end-to-end).
namios = "namios_cli.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: assert là cách chuẩn trong pytest, không phải nguy cơ an ninh.
# UP042: M1-INTERFACES.md quy định tường minh `(str, Enum)` cho ErrorCode/
#   TxState/CompatStatus/AppMode (hợp đồng dùng chung cho 9 WP khác) — GIỮ
#   nguyên chữ ký này, không đổi sang `enum.StrEnum`.
ignore = ["S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "namios_core.*"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
