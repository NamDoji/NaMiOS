# CI cho NaMiOS — PHẠM VI: chỉ M1 (lõi Python thuần: namios_core + 9 package
# WP khác chạy trên Debian runner chuẩn). KHÔNG build ISO/live-build, KHÔNG
# Wine/.NET runner, KHÔNG app thương mại ở workflow này — các mốc đó (M2/M3/M4)
# cần build host riêng có nested-virt + wine + bộ cài có quyền dùng, BLOCKED
# trên GitHub-hosted runner mặc định. Xem CLAUDE.md + docs/STATUS.md.
#
# Để kích hoạt thật trên GitHub Actions, copy file này thành
# .github/workflows/ci.yml (đặt ngoài ci/ theo yêu cầu GitHub) khi repo đã có
# remote + quyền ghi .github/.

name: namios-m1-ci

on:
  push:
    branches: ["main", "prod"]
  pull_request:

jobs:
  lint:
    name: lint (ruff + black --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: black --check
        run: black --check src tests

  typecheck:
    name: typecheck (mypy strict trên namios_core)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: mypy
        run: mypy src/namios_core

  test:
    name: pytest (unit + security + system — không cần Wine/KVM/ISO)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  # CỐ Ý KHÔNG có job build-iso / wine-smoke / hardware-pilot ở M1.
  # Các job đó thuộc M2 (Wine/.NET + prefix+sandbox proof — cần nested-virt),
  # M3 (ISO live-build + boot/install QEMU — cần qemu/KVM/live-build/xorriso),
  # M4 (app thương mại + hardware pilot — cần bộ cài có quyền dùng + máy pilot).
  # Mở các job này CHỈ khi có self-hosted runner đáp ứng điều kiện trên; nếu
  # không, ghi blocked_external_dependency — KHÔNG giả lập để báo đạt.
